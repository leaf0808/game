<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="跟随白兔，选择兔子洞、毛毛虫的树枝或公爵夫人的小屋，开启爱丽丝仙境旅程。">
  <meta name="theme-color" content="#172129">
  <title>Alice's Wonderland Journey</title>
  <link rel="preload" href="./assets/ui/wonderland-map.png" as="image">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./shared/transition.css">
  <script src="./shared/transition.js" defer></script>
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <div class="smoke-transition" aria-hidden="true">
    <span class="smoke-cloud"></span><span class="smoke-cloud"></span><span class="smoke-cloud"></span>
    <span class="smoke-cloud"></span><span class="smoke-cloud"></span><span class="smoke-cloud"></span>
    <span class="smoke-cloud"></span><span class="smoke-cloud"></span><span class="smoke-cloud"></span>
  </div>

  <svg class="svg-defs" aria-hidden="true">
    <defs>
      <filter id="map-title-warp" x="-5%" y="-15%" width="110%" height="130%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.08" numOctaves="1" seed="6" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="map-subtitle-warp" x="-5%" y="-15%" width="110%" height="130%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.065" numOctaves="1" seed="9" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <symbol id="corner-flora" viewBox="0 0 220 220">
        <path d="M10 12C70 20 120 65 178 148M35 20C75 55 90 110 95 185" fill="none" stroke="#66704d" stroke-width="2" stroke-linecap="round"/>
        <path d="M67 48C36 52 25 34 31 18C52 18 69 29 67 48Z" fill="#79805a" stroke="#4f5b42" stroke-width="1"/>
        <path d="M104 78C108 48 130 41 145 48C143 68 128 83 104 78Z" fill="#69764f" stroke="#4f5b42" stroke-width="1"/>
        <path d="M88 119C61 112 46 126 47 143C66 150 84 140 88 119Z" fill="#89906a" stroke="#4f5b42" stroke-width="1"/>
        <path d="M135 121C146 96 165 94 179 104C172 124 154 131 135 121Z" fill="#737e55" stroke="#4f5b42" stroke-width="1"/>
        <path d="M94 163C111 153 127 162 131 177C116 187 101 181 94 163Z" fill="#8a9168" stroke="#4f5b42" stroke-width="1"/>
        <path d="M38 34L57 41M112 72L135 54M81 130L56 137M142 118L169 108M99 166L122 174" fill="none" stroke="#b1ad7c" stroke-width="0.8" opacity="0.7"/>
        <g transform="translate(56 55)" fill="#c99b94" stroke="#8f6c67" stroke-width="0.8">
          <ellipse rx="13" ry="22" transform="rotate(0) translate(0 -10)"/>
          <ellipse rx="13" ry="22" transform="rotate(72) translate(0 -10)"/>
          <ellipse rx="13" ry="22" transform="rotate(144) translate(0 -10)"/>
          <ellipse rx="13" ry="22" transform="rotate(216) translate(0 -10)"/>
          <ellipse rx="13" ry="22" transform="rotate(288) translate(0 -10)"/>
          <circle r="9" fill="#b7847e"/>
          <path d="M-4 1C-2-5 6-5 5 1C4 6-3 7-4 1Z" fill="#d9b3a7"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <div class="firefly-field" id="firefly-field" aria-hidden="true"></div>

  <div class="flora-corner flora-corner--tl" aria-hidden="true">
    <svg viewBox="0 0 220 220"><use href="#corner-flora"></use></svg>
    <span class="corner-petal corner-petal--one"></span>
    <span class="corner-petal corner-petal--two"></span>
  </div>
  <div class="flora-corner flora-corner--tr" aria-hidden="true">
    <svg viewBox="0 0 220 220"><use href="#corner-flora"></use></svg>
    <span class="corner-petal corner-petal--one"></span>
    <span class="corner-petal corner-petal--two"></span>
  </div>
  <div class="flora-corner flora-corner--bl" aria-hidden="true">
    <svg viewBox="0 0 220 220"><use href="#corner-flora"></use></svg>
    <span class="corner-petal corner-petal--one"></span>
    <span class="corner-petal corner-petal--two"></span>
  </div>
  <div class="flora-corner flora-corner--br" aria-hidden="true">
    <svg viewBox="0 0 220 220"><use href="#corner-flora"></use></svg>
    <span class="corner-petal corner-petal--one"></span>
    <span class="corner-petal corner-petal--two"></span>
  </div>

  <main class="journey">
    <h1 class="sr-only">Alice's Wonderland Journey — 爱丽丝仙境旅程</h1>

    <div class="map-frame">
      <img
        class="map-image"
        id="map-image"
        src="./assets/ui/wonderland-map.png"
        width="1792"
        height="1024"
        alt="爱丽丝仙境旅程地图：兔子洞、毛毛虫的树枝与公爵夫人的小屋由虚线依次连接"
        draggable="false"
      >

      <div class="map-loading" aria-hidden="true">
        <span></span>
      </div>

      <div class="map-typography" aria-hidden="true">
        <span class="map-text-effect map-english map-english--title">
          <img src="./assets/ui/wonderland-map.png" alt="" draggable="false">
        </span>
        <span class="map-text-effect map-english map-english--subtitle">
          <img src="./assets/ui/wonderland-map.png" alt="" draggable="false">
        </span>
        <span class="map-text-effect map-label map-label--rabbit">
          <img src="./assets/ui/wonderland-map.png" alt="" draggable="false">
        </span>
        <span class="map-text-effect map-label map-label--caterpillar">
          <img src="./assets/ui/wonderland-map.png" alt="" draggable="false">
        </span>
        <span class="map-text-effect map-label map-label--duchess">
          <img src="./assets/ui/wonderland-map.png" alt="" draggable="false">
        </span>
      </div>

      <nav class="map-navigation" aria-label="选择仙境地点">
        <a
          class="hotspot hotspot--rabbit"
          data-smoke-link
          data-scene="rabbit_hole"
          href="./rabbit_hole/index.html"
          aria-label="进入第一站：兔子洞"
        >
          <span class="hotspot-visual" aria-hidden="true">
            <img src="./assets/ui/wonderland-map.png" alt="" draggable="false">
          </span>
          <span class="hotspot-ring" aria-hidden="true"></span>
        </a>
        <a
          class="hotspot hotspot--caterpillar is-locked"
          data-smoke-link
          data-scene="caterpillar_tree"
          href="./caterpillar_tree/index.html"
          aria-label="进入第二站：毛毛虫的树枝"
        >
          <span class="hotspot-visual" aria-hidden="true">
            <img src="./assets/ui/wonderland-map.png" alt="" draggable="false">
          </span>
          <span class="hotspot-ring" aria-hidden="true"></span>
        </a>
        <a
          class="hotspot hotspot--duchess is-locked"
          data-smoke-link
          data-scene="duchess_cottage"
          href="./duchess_cottage/index.html"
          aria-label="进入第三站：公爵夫人的小屋"
        >
          <span class="hotspot-visual" aria-hidden="true">
            <img src="./assets/ui/wonderland-map.png" alt="" draggable="false">
          </span>
          <span class="hotspot-ring" aria-hidden="true"></span>
        </a>
      </nav>
    </div>

    <p class="map-caption"><span aria-hidden="true"></span>选择一处地点，进入仙境<span aria-hidden="true"></span></p>
  </main>

  <script src="./scripts/loading.js"></script>
  <script src="./shared/progress.js"></script>
  <script src="./scripts/map_nav.js"></script>
</body>
</html>
