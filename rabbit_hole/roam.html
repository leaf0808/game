  for (let i = 0; i < 46; i++) {
    const spread = rnd(0, 1);
    const a = rnd(-1.15, 1.15);
    let mx = Math.sin(a) * (3 + spread * 13);
    const mz = -18.4 - Math.cos(a) * spread * 3.2 + rnd(0, 3.8);
    /* 挤到小路外侧，别长在砖面上 */
    mx = Math.sign(mx || 1) * Math.max(Math.abs(mx), hw(nearest(cor, mx, mz).index / cor.samples) + rnd(0.5, 2.5));
    if (tinyDoors.some((d) => Math.hypot(d.position.x - mx, d.position.z - mz) < 2.2)) continue;
    const capR = rnd(0.13, 0.42) * (Math.random() < 0.12 ? 1.6 : 1);
    const m = makeMushroom(capR);
    m.position.set(mx, 0, mz);
    m.rotation.y = rnd(0, 6.28);
    scene.add(m);
    scene.add(contactShadow(mx, mz, capR * 1.5, capR * 1.3, 0.7));
  }
  for (let i = 0; i < 30; i++) {
    /* 藤条从丘壁上方垂下，保持世界 -Y 方向才有"挂下来"的读感 */
    const p = moundPoint(M, rnd(-1.15, 1.15), rnd(6, 15));
    scene.add(vineStrand(p.x, p.y, p.z + 0.5, rnd(1.6, 5.2)));
  }
  for (let i = 0; i < 18; i++) {
    const a = rnd(-1.5, 1.5);
    let rx = Math.sin(a) * rnd(4, 16);
    const rz = -18.5 - Math.abs(Math.cos(a)) * rnd(0, 2.5) + rnd(-1, 5);
    rx = Math.sign(rx || 1) * Math.max(Math.abs(rx), hw(nearest(cor, rx, rz).index / cor.samples) + rnd(0.4, 2.2));
    if (tinyDoors.some((d) => Math.hypot(d.position.x - rx, d.position.z - rz) < 1.9)) continue;
    const rock = makeRock(rnd(0.4, 1.1));
    rock.position.set(rx, 0.15, rz);
    scene.add(rock);
    scene.add(contactShadow(rx, rz, 1.1, 0.95, 0.7));
    if (Math.hypot(rx, rz + 18) > 5) obstacles.push({ x: rx, z: rz, r: 0.7 });
  }

  const edgeArea = () => {
    const t = rnd(0.02, 0.98);
    const s = cor.table[Math.round(t * cor.samples)];
    const side = Math.random() < 0.5 ? -1 : 1;
    const off = hw(t) + rnd(0.2, 5);
    return { x: s.x + s.sx * side * off, z: s.z + s.sz * side * off };
  };
  scene.add(makeBillboards('grassBill', 300, edgeArea, 0xcdd4ac));
  scene.add(makeBillboards('flowerBill', 90, edgeArea, 0xe4dcc4));

  const mist = makeMist(18, (i, n) => {
    const t = i / n;
    const s = cor.table[Math.round(t * cor.samples)];
    return { x: s.x, y: rnd(0.8, 2.4), z: s.z };
  }, 0xb9b89a, 0.17, 8, 20);
  scene.add(mist);

  const motes = makeMotes(18, () => {
    const t = rnd(0.05, 0.95);
    const s = cor.table[Math.round(t * cor.samples)];
    const side = Math.random() < 0.5 ? -1 : 1;
    return { x: s.x + s.sx * side * hw(t) * rnd(0.2, 1.2), y: rnd(0.5, 3.6), z: s.z + s.sz * side * hw(t) * rnd(0.2, 1.2) };
  }, 0xffd98a, 0.22, true);
  scene.add(motes);

  const rabbit = makeRabbit();
  rabbit.scale.setScalar(1.18);
  scene.add(rabbit);
  let rabbitT = 0.2;

  const state = {
    scene, cor, obstacles,
    spawn: { x: cor.table[2].x, z: cor.table[2].z, yaw: 0 },
    progress: () => nearest(cor, world.player.position.x, world.player.position.z).index / cor.samples,
    reachedEnd: () => world.player.position.z < -20.4 || state.progress() > 0.985,
    update(dt, t) {
      const pr = state.progress();

      /* 光线向洞口汇聚：越往里越暗、雾越浓，但暗下去的部分由洞口的暖光补回来，
         岩壁和砖路的线稿还得读得清，不能整段糊成黑块。 */
      const k = Math.min(1, Math.max(0, (pr - 0.25) / 0.7));
      amb.intensity = 0.5 - k * 0.20;
      hemi.intensity = 0.55 - k * 0.26;
      sun.intensity = 0.42 - k * 0.20;
      scene.fog.density = 0.024 + k * 0.024;
      mouthLight.intensity = 0.9 + k * 2.8 + Math.sin(t * 1.7) * 0.14;
      /* 雾色同步压暗，读起来就是"光被洞口吸走" */
      scene.fog.color.setHex(0x74775a).lerp(HOLE_DARK, k);
      /* 小树门透出的暖光：洞里越暗，这几点暖光越要跳出来，否则门会被丘壁吞掉 */
      tinyDoors.forEach((d, i) => {
        if (d.userData.glow) d.userData.glow.material.opacity = 0.5 + k * 0.25 + Math.sin(t * 1.1 + i) * 0.14;
      });

      /* 兔子一路跳进洞里 */
      const target = Math.min(0.99, Math.max(rabbitT + 0.03, pr + 0.16));
      rabbitT += (target - rabbitT) * Math.min(1, dt * 1.4);
      const s = cor.table[Math.round(rabbitT * cor.samples)];
      const hop = Math.abs(Math.sin(t * 3.6)) * 0.32;
      rabbit.position.set(s.x + s.sx * 0.5, hop, s.z + s.sz * 0.5);
      rabbit.rotation.set(-hop * 0.6, Math.atan2(s.tx, s.tz), 0);

      mist.children.forEach((m) => {
        m.position.z += m.userData.drift * dt * 0.6;
        m.material.opacity = 0.12 + Math.sin(t * 0.3 + m.userData.phase) * 0.05;
        m.quaternion.copy(camera.quaternion);
      });
      motes.children.forEach((mo) => {
        const u = mo.userData;
        mo.position.x = u.home.x + Math.sin(t * u.rate + u.phase) * u.amp;
        mo.position.y = u.home.y + Math.sin(t * u.rate * 0.6 + u.phase) * u.amp * 0.35;
        mo.material.opacity = 0.3 + Math.abs(Math.sin(t * u.rate * 1.4 + u.phase)) * 0.6;
      });
    },
  };
  return state;
}

/** 椭ipsoid 土丘表面取点 + 法线，用来贴小树门和藤蔓 */
function moundPoint(M, ang, y) {
  const s = (y - M.cy) / M.ry;
  const k = Math.sqrt(Math.max(0.0001, 1 - s * s));
  const x = M.cx + M.rx * k * Math.sin(ang);
  const z = M.cz + M.rz * k * Math.cos(ang);
  const n = new THREE.Vector3((x - M.cx) / M.rx, (y - M.cy) / M.ry, (z - M.cz) / M.rz).normalize();
  return { x, y, z, n };
}

/* ============================================================================
   9. 幕 3 · 洞穴内部大厅
      粗糙岩壁 + 大小不一的弧形木门 + 中央木桌（蛋糕与玻璃瓶）。
   ========================================================================== */

function buildHall() {
  const R = 23;                                   // 大厅半径
  const scene = newScene('#2b2721', '#171410', 0x211d18, 0.019);

  /* 洞内亮度压低：环境光为主，少量暖点光。
     "压低"是相对户外而言——雾再浓、光再暗，整厅就糊成一团黑，构图也白搭了：
     岩壁的线稿要能在最暗处也读出来，所以这里留了一条下限。 */
  const amb = new THREE.AmbientLight(0x9a9178, 1.05);
  const hemi = new THREE.HemisphereLight(0x6a6350, 0x191612, 0.72);
  scene.add(amb, hemi);

  /* 桌上的暖光：衰减按平方走，3 米外就掉得很快，所以中心要够亮才压得住整厅，
     又不至于把岩壁一起洗白。 */
  const tableLight = new THREE.PointLight(0xf0c47c, 3.2, 26, 2);
  tableLight.position.set(0, 4.4, 0);
  scene.add(tableLight);

  const entryLight = new THREE.PointLight(0xc9a86a, 1.3, 20, 2);
  entryLight.position.set(0, 3.2, R - 2.5);
  scene.add(entryLight);

  /* 地面石板：半径比岩壁略大一点，避免抖动后的墙脚漏光 */
  const floor = part(GEO.disc, mat('caveFloor', 8, 8, { color: 0xb6ac93 }), [0, 0, 0], [R + 1.6, R + 1.6, 1], [-Math.PI / 2, 0, 0]);
  scene.add(floor);

  /* 岩壁：内壁朝内的开口圆柱 */
  const wallGeo = new THREE.CylinderGeometry(R, R * 1.04, 15, 56, 3, true);
  wobble(wallGeo, 0.55, 0.35);
  const wall = new THREE.Mesh(wallGeo, new THREE.MeshLambertMaterial({
    map: tiled(TEX.caveWall, 15, 2), color: 0xc4ba9f, side: THREE.BackSide,
  }));
  wall.position.y = 7.5;
  scene.add(wall);

  /* 穹顶 */
  const roofGeo = new THREE.SphereGeometry(R, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.52);
  wobble(roofGeo, 0.5, 0.3);
  const roof = new THREE.Mesh(roofGeo, new THREE.MeshLambertMaterial({
    map: tiled(TEX.caveWall, 12, 5), color: 0xb8b09e, side: THREE.BackSide,
  }));
  roof.scale.y = 0.52;
  roof.position.y = 14.2;
  scene.add(roof);

  /* 钟乳石 */
  for (let i = 0; i < 26; i++) {
    const a = rnd(0, 6.28), r = rnd(3, R - 3);
    const h = rnd(1.2, 4.2);
    const stal = part(new THREE.ConeGeometry(rnd(0.2, 0.6), h, 8, 3), mat('caveWall', 1, 2),
      [Math.cos(a) * r, 12.4 - h * 0.4, Math.sin(a) * r], null, [Math.PI, 0, 0]);
    scene.add(stal);
    /* 地面石笋 */
    if (Math.random() < 0.5) {
      const h2 = rnd(0.8, 2.4);
      scene.add(part(new THREE.ConeGeometry(rnd(0.3, 0.8), h2, 8, 3), mat('caveWall', 1, 1),
        [Math.cos(a + 0.4) * r, h2 * 0.4, Math.sin(a + 0.4) * r]));
    }
  }

  const obstacles = [];

  /* 岩壁上大大小小的弧形木门 */
  const doors = [];
  const doorCount = 13;
  for (let i = 0; i < doorCount; i++) {
    /* 入口门（+Z）与尽头门（-Z）单独留位 */
    const a = (i / doorCount) * Math.PI * 2 + 0.24;
    if (Math.abs(Math.sin(a)) < 0.12) continue;
    const w = rnd(1.1, 3.6), h = w * rnd(1.3, 1.9);
    const lit = Math.random() < 0.35;
    const d = makeDoor(w, h, { glow: lit ? rnd(0.4, 0.75) : 0, knob: Math.random() < 0.6, tiles: 2 });
    d.position.set(Math.sin(a) * (R - 0.5), rnd(-0.1, 0.3), Math.cos(a) * (R - 0.5));
    d.rotation.y = a + Math.PI;
    scene.add(d);
    doors.push(d);
    if (lit) {
      const pl = new THREE.PointLight(0xe6b874, 0.85, 12, 2);
      pl.position.set(Math.sin(a) * (R - 2.4), h * 0.5, Math.cos(a) * (R - 2.4));
      scene.add(pl);
      d.userData.light = pl;
    }
    /* 门前的乱石与蘑菇 */
    if (Math.random() < 0.6) {
      const rock = makeRock(rnd(0.4, 0.9));
      rock.position.set(Math.sin(a) * (R - 2.6), 0.1, Math.cos(a) * (R - 2.6));
      scene.add(rock);
    }
  }

  /* 入口：幕 2 走进来的那扇大拱门 */
  const entry = makeDoor(6.4, 6.6, { glow: 0.5 });
  entry.position.set(0, 0, R - 0.4);
  entry.rotation.y = Math.PI;
  scene.add(entry);

  /* 尽头最大的那扇门 = 本章出口 */
  const exitDoor = makeDoor(4.6, 7.4, { glow: 0.85, knob: true, tiles: 1.5 });
  exitDoor.position.set(0, 0, -(R - 0.4));
  scene.add(exitDoor);
  const exitLight = new THREE.PointLight(0xf2c37f, 1.5, 18, 2);
  exitLight.position.set(0, 3.2, -(R - 3));
  scene.add(exitLight);

  /* ---- 中央木桌 + 蛋糕 + 玻璃瓶 ---- */
  const table = new THREE.Group();
  const TW = 3.6, TD = 2.0, TH = 1.05;
  const top = part(GEO.box, mat('wood', 2, 1), [0, TH, 0], [TW, 0.22, TD]);
  withOutline(top, 0.02);
  table.add(top);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = part(new THREE.CylinderGeometry(0.1, 0.14, TH, 8, 2), mat('wood', 1, 1),
      [sx * (TW / 2 - 0.3), TH / 2, sz * (TD / 2 - 0.28)]);
    withOutline(leg, 0.05);
    table.add(leg);
  }
  table.add(part(GEO.box, mat('wood', 2, 1), [0, TH * 0.42, 0], [TW * 0.82, 0.1, TD * 0.6]));

  /* 三层蛋糕 + 糖霜 + 樱桃 */
  const cake = new THREE.Group();
  const tiers = [[0.62, 0.30], [0.48, 0.26], [0.34, 0.22]];
  let cy = 0;
  tiers.forEach(([r, h], i) => {
    const t = part(new THREE.CylinderGeometry(r, r * 1.04, h, 18, 1), mat('cake', 2, 1), [0, cy + h / 2, 0]);
    withOutline(t, 0.03);
    cake.add(t);
    /* 糖霜：沿每层顶边围一圈奶白，再垂下几滴。
       糖霜必须跟着受光（Lambert），否则自发光的小白点会把蛋糕读成一窝蛋。 */
    cake.add(part(new THREE.CylinderGeometry(r * 1.03, r * 1.03, h * 0.42, 18, 1, true),
      new THREE.MeshLambertMaterial({ color: 0xf3e7cb, side: THREE.DoubleSide }), [0, cy + h * 0.78, 0]));
    const icing = new THREE.MeshLambertMaterial({ color: 0xf3e7cb });
    for (let k = 0; k < 5; k++) {
      const a = (k + i * 0.6) / 5 * Math.PI * 2;
      cake.add(part(GEO.lowSphere, icing, [Math.cos(a) * r * 1.04, cy + h * 0.66, Math.sin(a) * r * 1.04],
        [r * 0.15, r * 0.26, r * 0.15]));
    }
    cy += h;
  });
  for (let k = 0; k < 3; k++) {
    cake.add(part(GEO.lowSphere, flatMat(0xb8412f), [rnd(-0.12, 0.12), cy + 0.08, rnd(-0.12, 0.12)], [0.09, 0.09, 0.09]));
  }
  cake.position.set(-0.85, TH + 0.11, 0.05);
  table.add(cake);
  table.add(part(GEO.disc, mat('caveFloor', 1, 1), [-0.85, TH + 0.12, 0.05], [1.0, 1.0, 1], [-Math.PI / 2, 0, 0]));

  /* 玻璃瓶：细颈 + 软木塞 + 标签，微微自发光表示"药水" */
  const bottle = new THREE.Group();
  const glassMat = new THREE.MeshLambertMaterial({
    color: 0xa8c8c0, transparent: true, opacity: 0.62,
    emissive: 0x2e4a44, emissiveIntensity: 0.6,
  });
  bottle.add(part(new THREE.CylinderGeometry(0.22, 0.24, 0.5, 14, 1), glassMat, [0, 0.25, 0]));
  bottle.add(part(new THREE.CylinderGeometry(0.09, 0.2, 0.16, 14, 1), glassMat, [0, 0.58, 0]));
  bottle.add(part(new THREE.CylinderGeometry(0.08, 0.08, 0.26, 12, 1), glassMat, [0, 0.79, 0]));
  bottle.add(part(new THREE.CylinderGeometry(0.09, 0.09, 0.1, 10, 1), mat('wood', 1, 1), [0, 0.96, 0]));
  bottle.add(part(GEO.plane, mat('cloth', 1, 1, { color: 0xe8dcc0, side: THREE.DoubleSide }), [0, 0.3, 0.245], [0.3, 0.22, 1]));
  const bottleGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: SPR.glow, color: 0x9fd6c0, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0.5,
  }));
  bottleGlow.scale.set(1.5, 1.7, 1);
  bottleGlow.position.y = 0.5;
  bottle.add(bottleGlow);
  bottle.position.set(0.95, TH + 0.11, -0.1);
  table.add(bottle);

  /* 桌上一把小刀和几只盘子，补足静物构图 */
  for (let i = 0; i < 2; i++) {
    table.add(part(GEO.disc, mat('caveFloor', 1, 1), [0.1 + i * 0.5, TH + 0.12, 0.62], [0.34, 0.34, 1], [-Math.PI / 2, 0, 0]));
  }
  table.position.set(0, 0, 0);
  scene.add(table);
  obstacles.push({ x: 0, z: 0, r: 2.5 });

  /* 角落散落的蘑菇 */
  for (let i = 0; i < 22; i++) {
    const a = rnd(0, 6.28);
    const r = rnd(R * 0.42, R - 1.6);
    const m = makeMushroom(rnd(0.25, 0.85));
    m.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    if (Math.hypot(m.position.x, m.position.z) > 3.4) scene.add(m);
    else i--;
  }
  /* 靠墙的碎石 */
  for (let i = 0; i < 18; i++) {
    const a = rnd(0, 6.28), r = rnd(R * 0.5, R - 1.2);
    const rock = makeRock(rnd(0.3, 0.8));
    rock.position.set(Math.cos(a) * r, 0.1, Math.sin(a) * r);
    scene.add(rock);
  }

  /* 洞内朦胧雾气（贴地）与浮尘 */
  const mist = makeMist(24, (i, n) => {
    const a = i / n * 6.28 + rnd(-0.2, 0.2), r = rnd(4, R - 2);
    return { x: Math.cos(a) * r, y: rnd(0.4, 2.6), z: Math.sin(a) * r };
  }, 0x8d8570, 0.13, 7, 16);
  scene.add(mist);

  const dust = makeMotes(70, () => {
    const a = rnd(0, 6.28), r = rnd(0, R - 3);
    return { x: Math.cos(a) * r, y: rnd(0.4, 8), z: Math.sin(a) * r };
  }, 0xd8c49a, 0.16, false);
  scene.add(dust);

  /* 头顶几处微光，替代"洞口汇聚"的光源。别太大太亮，否则变成一串悬空的灯泡 */
  const glows = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const a = rnd(0, 6.28), r = rnd(6, R - 4);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: SPR.glow, color: 0xe8c07a, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, opacity: 0.26,
    }));
    s.scale.set(rnd(1.1, 2.0), rnd(1.1, 2.0), 1);
    s.position.set(Math.cos(a) * r, rnd(6.5, 10), Math.sin(a) * r);
    s.userData.phase = rnd(0, 6);
    glows.add(s);
  }
  scene.add(glows);

  const state = {
    scene, obstacles,
    cor: null,
    /* 出生点往里收：镜头在身后 7.4m，贴着壁就会退到壁外变成黑屏 */
    spawn: { x: 0, z: R - 10, yaw: 0 },
    radius: R - 1.4,
    camRadius: R - 1.0,
    progress: () => {
      const p = world.player.position;
      return THREE.MathUtils.clamp(1 - (Math.hypot(p.x, p.z + (R - 3)) / (R - 4)), 0, 1);
    },
    reachedEnd: () => {
      const p = world.player.position;
      return p.z < -(R - 4) && Math.abs(p.x) < 4.2;
    },
    update(dt, t) {
      tableLight.intensity = 1.25 + Math.sin(t * 1.3) * 0.12;
      exitLight.intensity = 1.1 + Math.sin(t * 0.9) * 0.18;
      bottleGlow.material.opacity = 0.4 + Math.abs(Math.sin(t * 0.8)) * 0.3;
      doors.forEach((d, i) => {
        if (d.userData.light) d.userData.light.intensity = 0.55 + Math.sin(t * 1.1 + i) * 0.2;
        if (d.userData.glow) d.userData.glow.material.opacity = 0.4 + Math.sin(t * 1.1 + i) * 0.18;
      });
      glows.children.forEach((s) => {
        s.material.opacity = 0.28 + Math.abs(Math.sin(t * 0.5 + s.userData.phase)) * 0.3;
      });
      dust.children.forEach((mo) => {
        const u = mo.userData;
        mo.position.y = u.home.y + Math.sin(t * u.rate * 0.5 + u.phase) * 0.7;
        mo.position.x = u.home.x + Math.sin(t * u.rate * 0.3 + u.phase) * u.amp * 0.5;
        mo.material.opacity = 0.18 + Math.abs(Math.sin(t * u.rate + u.phase)) * 0.35;
      });
      mist.children.forEach((m) => {
        m.material.opacity = 0.10 + Math.sin(t * 0.22 + m.userData.phase) * 0.04;
        m.quaternion.copy(camera.quaternion);
      });
    },
  };
  return state;
}

/* ============================================================================
   11. 爱丽丝 —— 正式角色模型（Desktop/als.blend）
       ----------------------------------------------------------------------------
       数据文件：./assets/alice.js  ->  window.ALICE_MODEL = {meta, pos, nrm, uv, idx, tex}
       它是用 _tools/export_alice.py 跑 Blender 无头导出的结果：
         · 原始网格 197 万三角形 / 4096² 贴图，直接搬进浏览器会卡；
           这里减面到 3 万三角形、贴图压到 1024（不透明，走 JPEG）。
         · 顶点量化成 int16（位置毫米、法线 *32767），索引 uint16，UV 保持 float32。
         · 坐标已从 Blender 的 Z-up 转成 three.js 的 Y-up，原点在两脚中间的地面，
           身高归一化到 meta.height（1.58 m）。
       为什么不用 .glb：本项目要能直接 file:// 双击打开，.glb 走 fetch 会被浏览器拦，
       而 <script> 引入的 js 常量 + data URI 贴图不受限制，也不需要额外挂 GLTFLoader。
       换模型 / 调精度：改 export_alice.py 里的 SRC / TARGET_H / TARGET_TRIS / TEX_PX 重跑。
       ----------------------------------------------------------------------------
       这里有两条路：
         · 首选 assets/alice_walk.js（带骨骼的 1 秒走路 GLB，由 alice_rig.py 生成），
           解析器见下方 buildWalkAlice()，mixer 的播放速度跟着实际移速走；
         · 没有 GLB 时退回静态网格，走路靠整块起伏 + 前倾 + 侧摆来演（animateAlice）。
       正面朝向：游戏里角色前进方向是本地 +Z，如果模型面朝反了，只调 ALICE_YAW 一个数。
   ========================================================================== */

const ALICE_YAW = 0;           // 模型正面与本地 +Z 的夹角（弧度）
const ALICE_OUTLINE = 0.0065;  // 手绘钢笔线粗细（米）；设 0 关闭

const ALICE = { geo: null, mat: null, tex: null };

/** base64 -> Uint8Array */
function aliceBytes(s) {
  const bin = atob(s);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

/** 解码 window.ALICE_MODEL 成 BufferGeometry；资源缺失时返回 null */
function aliceGeometry() {
  const M = window.ALICE_MODEL;
  if (!M || !M.pos) return null;
  const nv = M.meta.verts;
  const raw = new Int16Array(aliceBytes(M.pos).buffer);
  const ran = new Int16Array(aliceBytes(M.nrm).buffer);
  const ruv = new Float32Array(aliceBytes(M.uv).buffer);
  const pos = new Float32Array(nv * 3);
  const nrm = new Float32Array(nv * 3);
  for (let i = 0; i < nv * 3; i++) {
    pos[i] = raw[i] / 1000;        // 毫米 -> 米
    nrm[i] = ran[i] / 32767;
  }
  const idx = M.meta.indexType === 'u16'
    ? new Uint16Array(aliceBytes(M.idx).buffer)
    : new Uint32Array(aliceBytes(M.idx).buffer);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(ruv, 2));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeBoundingSphere();
  return g;
}

function aliceTexture() {
  if (ALICE.tex) return ALICE.tex;
  const M = window.ALICE_MODEL;
  if (!M || !M.tex) return null;
  const img = new Image();
  const t = new THREE.Texture(img);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  img.onload = () => { t.needsUpdate = true; };
  img.src = M.tex;
  ALICE.tex = t;
  return t;
}

/** 沿法线外扩的背面壳：厚度是world单位，不会像整体缩放那样头顶粗、脚底没线 */
function meshOutline(mesh, mm) {
  if (!(mm > 0)) return mesh;
  const hull = new THREE.Mesh(mesh.geometry, new THREE.MeshBasicMaterial({
    color: CONFIG.outline.color, side: THREE.BackSide,
  }));
  hull.material.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n  transformed += normalize(normal) * ' + mm.toFixed(5) + ';');
  };
  hull.material.customProgramCacheKey = () => 'alice-hull-' + mm;
  hull.renderOrder = -1;
  mesh.add(hull);
  return mesh;
}

/* ----------------------------------------------------------------------------
   走路 GLB：一个只认"蒙皮网格 + 一条动画"的最小 glTF 2.0 解析器
   ---------------------------------------------------------------------------
   为什么不用 GLTFLoader：本项目要能 file:// 双击打开，GLTFLoader 不在 r160 的
   UMD 包里，而 .glb 走 fetch 会被浏览器拦。所以模型以 base64 常量随 <script>
   进来（assets/alice_walk.js），这里只实现我们这份 GLB 用到的部分：
   chunk 解析 → accessor 读取 → Bone / SkinnedMesh / AnimationClip。
   换成别的 glTF 2.0 蒙皮模型通常也能直接吃，前提是只有网格 + 骨骼 + 动画。
   -------------------------------------------------------------------------- */
const WALK = { done: false, root: null, mixer: null, action: null, clip: null, mesh: null };

/** GLB 分块：12 字节头 + JSON 块 + BIN 块，每个块长都按 4 字节对齐 */
function glbChunks(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  if (dv.getUint32(0, true) !== 0x46546C67) return null;   // 魔数 'glTF'
  let off = 12, json = null, bin = null;
  while (off + 8 <= u8.byteLength) {
    const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true);
    const body = u8.subarray(off + 8, off + 8 + len);
    if (type === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(body));  // 'JSON'
    else if (type === 0x004E4942) bin = body;                                    // 'BIN\0'
    off += 8 + len + ((4 - (len % 4)) % 4);
  }
  return json && bin ? { json, bin } : null;
}

const GLB_CT = {
  5120: ['Int8Array', 'getInt8', 1], 5121: ['Uint8Array', 'getUint8', 1],
  5122: ['Int16Array', 'getInt16', 2], 5123: ['Uint16Array', 'getUint16', 2],
  5125: ['Uint32Array', 'getUint32', 4], 5126: ['Float32Array', 'getFloat32', 4],
};
const GLB_N = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4, MAT4: 16 };

/**
 * 读一个 accessor。故意用 DataView 逐元素读：
 * bufferView 的 byteOffset 不保证和组件大小对齐（uint8 的 JOINTS_0 会夹在
 * float 数据中间），直接 new Float32Array(buf, off) 会抛"未对齐"。
 */
function glbRead(J, bin, index) {
  const a = J.accessors[index];
  const ct = GLB_CT[a.componentType];
  const n = GLB_N[a.type];
  const out = new (window[ct[0]])(a.count * n);
  if (a.bufferView === undefined) return out;
  const bv = J.bufferViews[a.bufferView];
  const stride = bv.byteStride || n * ct[2];
  const base = (bv.byteOffset || 0) + (a.byteOffset || 0);
  const dv = new DataView(bin.buffer, bin.byteOffset + base, bv.byteLength - (a.byteOffset || 0));
  for (let k = 0; k < a.count; k++) {
    for (let c = 0; c < n; c++) out[k * n + c] = dv[ct[1]](k * stride + c * ct[2], true);
  }
  return out;
}

/** 节点名清洗：Three 的 track name 用 "." 分段，骨名里的 "thigh.L" 会被切碎 */
const glbName = (n, i) => (n || ('node' + i)).replace(/[^A-Za-z0-9_]/g, '_');

/** GLB 内嵌贴图：bufferView → Blob → Image。glTF 的 UV 原点在左上，flipY 必须关 */
function glbTexture(J, bin) {
  const img = J.images && J.images[0];
  if (!img || img.bufferView === undefined) return null;
  const bv = J.bufferViews[img.bufferView];
  const off = bv.byteOffset || 0;
  const url = URL.createObjectURL(new Blob([bin.subarray(off, off + bv.byteLength)], { type: img.mimeType || 'image/jpeg' }));
  const t = new THREE.Texture();
  t.colorSpace = THREE.SRGBColorSpace;
  t.flipY = false;
  t.anisotropy = 4;
  const im = new Image();
  im.onload = () => { t.image = im; t.needsUpdate = true; URL.revokeObjectURL(url); };
  im.onerror = () => URL.revokeObjectURL(url);
  im.src = url;
  return t;
}

function buildWalkAlice() {
  if (WALK.done) return WALK.root ? WALK : null;
  WALK.done = true;
  if (!window.ALICE_WALK_GLB) return null;
  const g = glbChunks(aliceBytes(window.ALICE_WALK_GLB));
  if (!g) return null;
  const J = g.json, bin = g.bin;
  const skin = J.skins && J.skins[0];
  const prim = J.meshes && J.meshes[0] && J.meshes[0].primitives[0];
  if (!skin || !prim) return null;

  /* 骨骼：只给 skin.joints 里的节点建 Bone，TRS 直接拿节点上的静止值 */
  const jointSet = new Set(skin.joints);
  const boneByNode = {};
  J.nodes.forEach((nd, i) => {
    if (!jointSet.has(i)) return;
    const b = new THREE.Bone();
    b.name = glbName(nd.name, i);
    if (nd.translation) b.position.fromArray(nd.translation);
    if (nd.rotation) b.quaternion.fromArray(nd.rotation);
    if (nd.scale) b.scale.fromArray(nd.scale);
    boneByNode[i] = b;
  });
  J.nodes.forEach((nd, i) => {
    if (!boneByNode[i]) return;
    (nd.children || []).forEach((c) => { if (boneByNode[c]) boneByNode[i].add(boneByNode[c]); });
  });

  /* 骨架根：没有"父级也在 joints 里"的那一根 */
  let rootBone = null;
  for (const i of skin.joints) {
    const parents = skin.joints.filter((j) => (J.nodes[j].children || []).includes(i));
    if (!parents.length) { rootBone = boneByNode[i]; break; }
  }
  if (!rootBone) rootBone = boneByNode[skin.joints[0]];

  /* 网格 */
  const geo = new THREE.BufferGeometry();
  const A = prim.attributes;
  geo.setAttribute('position', new THREE.BufferAttribute(glbRead(J, bin, A.POSITION), 3));
  if (A.NORMAL !== undefined) geo.setAttribute('normal', new THREE.BufferAttribute(glbRead(J, bin, A.NORMAL), 3));
  if (A.TEXCOORD_0 !== undefined) geo.setAttribute('uv', new THREE.BufferAttribute(glbRead(J, bin, A.TEXCOORD_0), 2));
  geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(new Uint16Array(glbRead(J, bin, A.JOINTS_0)), 4));
  /* 注意属性名是单数 skinWeight —— Three 的蒙皮着色器只认这个名字，
     写成 skinWeights 不会报错，但权重全部读成默认值，整个人会塌成一个球 */
  geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(glbRead(J, bin, A.WEIGHTS_0), 4));
  if (prim.indices !== undefined) geo.setIndex(new THREE.BufferAttribute(glbRead(J, bin, prim.indices), 1));
  geo.computeBoundingSphere();

  const mesh = new THREE.SkinnedMesh(geo, new THREE.MeshLambertMaterial({
    color: 0xfff4e0,                 // 纸色暖偏 + 提亮：蓝裙不发闷、白围裙带暖纸色
    map: glbTexture(J, bin),
    side: THREE.DoubleSide,          // 原模型就是 doubleSided（裙内侧要看得见）
  }));
  const ibm = glbRead(J, bin, skin.inverseBindMatrices);
  const invBind = [];
  for (let i = 0; i < ibm.length; i += 16) invBind.push(new THREE.Matrix4().fromArray(ibm, i));
  mesh.bind(new THREE.Skeleton(skin.joints.map((i) => boneByNode[i]), invBind), new THREE.Matrix4());

  /* 描边：外扩壳必须也是 SkinnedMesh，否则它会停成静止姿态的一圈黑影 */
  if (ALICE_OUTLINE > 0) {
    const hm = new THREE.MeshBasicMaterial({ color: CONFIG.outline.color, side: THREE.BackSide });
    hm.onBeforeCompile = (sh) => {
      sh.vertexShader = sh.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  transformed += normalize(normal) * ' + ALICE_OUTLINE.toFixed(5) + ';');
    };
    hm.customProgramCacheKey = () => 'alice-walk-hull';
    const hull = new THREE.SkinnedMesh(geo, hm);
    hull.bind(mesh.skeleton, new THREE.Matrix4());
    hull.renderOrder = -1;
    mesh.add(hull);
  }

  /* 动画：每个通道一条 KeyframeTrack，用"清洗后的骨名"绑定 */
  let clip = null;
  if (J.animations && J.animations[0]) {
    const anim = J.animations[0];
    const tracks = [];
    const t0 = glbRead(J, bin, anim.samplers[anim.channels[0].sampler].input)[0];
    for (const ch of anim.channels) {
      const bone = boneByNode[ch.target.node];
      const path = ch.target.path;
      if (!bone || (path !== 'rotation' && path !== 'translation' && path !== 'scale')) continue;
      const smp = anim.samplers[ch.sampler];
      const times = glbRead(J, bin, smp.input);
      const vals = glbRead(J, bin, smp.output);
      /* Blender 从第 1 帧起算（0.0417 s），把时间轴平移到 0 起点才是无缝循环 */
      const ts = Float32Array.from(times, (v) => v - t0);
      const prop = path === 'rotation' ? 'quaternion' : (path === 'translation' ? 'position' : 'scale');
      const Track = path === 'rotation' ? THREE.QuaternionKeyframeTrack : THREE.VectorKeyframeTrack;
      tracks.push(new Track(bone.name + '.' + prop, ts, Float32Array.from(vals)));
    }
    if (tracks.length) clip = new THREE.AnimationClip('Walk', -1, tracks);
  }

  /* 组装：root 里放骨架和网格，外面再套一层只管朝向的 yaw 组。
     模型正面就是本地 +Z（和静态网格同一套约定），ALICE_YAW 一并放在这里。 */
  const root = new THREE.Group();
  root.add(rootBone);
  root.add(mesh);
  const yaw = new THREE.Group();
  yaw.rotation.y = ALICE_YAW;      // 实测对着路走时看到的是背影，正面已是本地 +Z
  yaw.add(root);

  const mixer = new THREE.AnimationMixer(root);
  let action = null;
  if (clip) {
    action = mixer.clipAction(clip);
    action.play();
    action.timeScale = 0;            // 站着不动就先定住
  }
  Object.assign(WALK, { root: yaw, mixer, action, clip, mesh });
  return WALK;
}

function makeAlice() {
  const g = new THREE.Group();
  /* rig 这一层专门挂走路动画；g 只负责朝向与体型缩放，两层互不打架 */
  const rig = new THREE.Group();
  g.add(rig);
  g.userData.rig = rig;

  /* 首选：带骨骼的走路 GLB（assets/alice_walk.js） */
  const walk = buildWalkAlice();
  if (walk) {
    rig.add(walk.root);
    g.userData.walk = walk;
    g.add(contactShadow(0, 0, 0.32, 0.26, 0.5));
    return g;
  }

  const geo = ALICE.geo || (ALICE.geo = aliceGeometry());
  if (!geo) return alicePlaceholder(g, rig);   // 没带 assets/alice.js 时的退路

  const mesh = new THREE.Mesh(geo, ALICE.mat || (ALICE.mat = new THREE.MeshLambertMaterial({
    color: 0xfff4e0,          // 轻微纸色暖偏，贴合绘本调色；要原汁原味就改 0xffffff
    map: aliceTexture(),
  })));
  mesh.rotation.y = ALICE_YAW;
  meshOutline(mesh, ALICE_OUTLINE);
  rig.add(mesh);
  g.add(contactShadow(0, 0, 0.34, 0.28, 0.72));
  return g;
}

/** 走路姿态。
    有骨骼行走 GLB 时：直接把 mixer 的播放速度绑到实际移动速度上
      —— 一个循环跨 0.76 m，按物理换算会变成电风扇，所以压成 0.7~2.2 倍，
         "步频看起来跟得上速度"就够，脚下滑一点在这种画风里几乎看不出来。
    没有骨骼时（老静态网格 / 占位胶囊）：整块起伏 + 前倾 + 侧摆假装在走。 */
function animateAlice(dt) {
  const rig = world.player.userData.rig;
  if (!rig) return;
  const sp = world.vel.length();
  const walk = world.player.userData.walk;

  if (walk && walk.mixer) {
    const k = Math.min(1, sp / CONFIG.walk.speed);
    if (walk.action) {
      walk.action.timeScale = sp > 0.15 ? 0.7 + k * 1.5 : 0;
      /* 站住时把姿势慢慢收到迈步中间（一个循环里 t≈0.25 是两腿交错），
         否则会正好卡在跨步最大的一帧上，站着却像定格在走路中间 */
      if (sp <= 0.15) {
        const cur = walk.action.time % 1;
        let d = 0.25 - cur;
        if (d > 0.5) d -= 1;
        if (d < -0.5) d += 1;
        walk.action.time = (cur + d * Math.min(1, dt * 2.5) + 1) % 1;
      }
    }
    walk.mixer.update(dt || 0);
    /* 站着时留一点呼吸 */
    rig.position.y = sp < 0.15 ? Math.sin(world.elapsed * 1.5) * 0.006 : 0;
    rig.rotation.set(0, 0, 0);
    return;
  }

  const gait = Math.min(1, sp / CONFIG.walk.speed);
  const t = world.elapsed;
  rig.position.y = Math.abs(Math.sin(t * 8.4)) * 0.05 * gait;
  rig.rotation.x = 0.055 * gait + Math.sin(t * 8.4) * 0.012 * gait;
  rig.rotation.z = Math.sin(t * 4.2) * 0.045 * gait;
  rig.rotation.y = Math.sin(t * 4.2) * 0.05 * gait;
}

/* ----------------------------------------------------------------------------
   占位胶囊：正式模型上线前用的那套，现在只在 assets/alice.js 缺失时兜底。
   -------------------------------------------------------------------------- */
function alicePlaceholder(g, rig) {
  const dress = new THREE.MeshLambertMaterial({ color: 0x7ba0c4, map: tiled(TEX.cloth, 1, 1) });
  const body = new THREE.Mesh(GEO.capsule, dress);
  body.position.y = 0.87;
  body.scale.set(0.82, 1, 0.78);
  withOutline(body, 0.05);
  rig.add(body);

  const skirt = part(new THREE.CylinderGeometry(0.30, 0.46, 0.52, 20, 1, true),
    new THREE.MeshLambertMaterial({ color: 0x7ba0c4, map: tiled(TEX.cloth, 1, 1), side: THREE.DoubleSide }),
    [0, 0.32, 0]);
  withOutline(skirt, 0.022);
  rig.add(skirt);

  rig.add(part(GEO.plane, new THREE.MeshLambertMaterial({
    color: 0xf2ead6, map: tiled(TEX.cloth, 1, 1), side: THREE.DoubleSide,
  }), [0, 0.86, 0.34], [0.28, 0.5, 1], [-0.06, 0, 0]));
  rig.add(part(GEO.disc, new THREE.MeshLambertMaterial({ color: 0xf2ead6, side: THREE.DoubleSide }), [0, 1.26, 0.24], [0.16, 0.12, 1], [1.35, 0, 0]));

  const head = part(GEO.lowSphere, new THREE.MeshLambertMaterial({ color: 0xf0e0c8 }), [0, 1.66, 0], [0.29, 0.31, 0.29]);
  withOutline(head, 0.06);
  rig.add(head);

  const hairMat = new THREE.MeshLambertMaterial({ color: 0xdcae4e });
  rig.add(part(GEO.lowSphere, hairMat, [0, 1.60, -0.13], [0.28, 0.30, 0.22]));
  rig.add(part(GEO.lowSphere, hairMat, [0, 1.82, -0.03], [0.25, 0.10, 0.23]));

  const sleeve = new THREE.MeshLambertMaterial({ color: 0x8fb1d2, map: tiled(TEX.cloth, 1, 1) });
  for (const s of [-1, 1]) {
    const arm = part(GEO.lowSphere, sleeve, [s * 0.28, 1.18, 0.02], [0.16, 0.20, 0.16]);
    withOutline(arm, 0.03);
    rig.add(arm);
  }

  g.add(contactShadow(0, 0, 0.52, 0.44, 0.9));
  return g;
}

/* ============================================================================
   12. 输入
   ========================================================================== */

const keys = Object.create(null);
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR') respawn();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* 拖拽转视角 */
let dragging = false, lastX = 0, lastY = 0;
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  world.camYaw -= (e.clientX - lastX) * 0.0055;
  world.camPitch = THREE.MathUtils.clamp(world.camPitch + (e.clientY - lastY) * 0.0032, 0.02, 0.95);
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  CONFIG.cam.distance = THREE.MathUtils.clamp(CONFIG.cam.distance + e.deltaY * 0.01, 3.5, 14);
}, { passive: false });

/* ============================================================================
   13. 移动与碰撞
   ========================================================================== */

function respawn() {
  if (!world.state) return;
  const sp = world.state.spawn;
  world.player.position.set(sp.x, 0, sp.z);
  world.camYaw = sp.yaw;
  world.vel.set(0, 0, 0);
  toast('回到这一幕的起点');
}

function updatePlayer(dt) {
  const st = world.state, p = world.player.position;

  const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (keys.KeyQ) world.camYaw += CONFIG.walk.turn * dt;
  if (keys.KeyE) world.camYaw -= CONFIG.walk.turn * dt;

  /* 以相机朝向为"前"，投影到水平面 */
  const fwd = new THREE.Vector3(-Math.sin(world.camYaw), 0, -Math.cos(world.camYaw));
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x);   // = (cos, 0, -sin)
  const wish = new THREE.Vector3().addScaledVector(fwd, f).addScaledVector(right, s);
  const moving = wish.lengthSq() > 0.0001;
  if (moving) wish.normalize();

  const speed = (keys.ShiftLeft || keys.ShiftRight ? CONFIG.walk.run : CONFIG.walk.speed);
  const target = wish.multiplyScalar(moving ? speed : 0);
  world.vel.lerp(target, Math.min(1, dt * CONFIG.walk.accel / 6));

  p.addScaledVector(world.vel, dt);

  /* 1) 道路边界  2) 圆形障碍  3) 大厅的圆形墙 */
  if (st.cor) {
    /* 路尾也能走：按离角色更近的那条走廊来约束 */
    let walkCor = st.cor;
    if (st.corB) {
      const da = nearest(st.cor, p.x, p.z).dist;
      const db = nearest(st.corB, p.x, p.z).dist;
      if (db < da) walkCor = st.corB;
    }
    clampToCorridor(walkCor, p, 0.6);
  }
  if (st.radius) {
    const d = Math.hypot(p.x, p.z);
    if (d > st.radius) { p.x *= st.radius / d; p.z *= st.radius / d; }
  }
  pushOut(st.obstacles, p, 0.5);
  p.y = 0;

  /* 朝向与走路时的轻微起伏 */
  const sp = world.vel.length();
  if (sp > 0.35) {
    const want = Math.atan2(world.vel.x, world.vel.z);
    let d = want - world.player.rotation.y;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    world.player.rotation.y += d * Math.min(1, dt * 9);
  }
  /* 走路姿态（骨骼动画或起伏 / 前倾 / 侧摆，见 animateAlice） */
  animateAlice(dt);
}

function updateCamera(dt) {
  const p = world.player.position;
  const yaw = world.camYaw, pitch = world.camPitch;
  const horiz = CONFIG.cam.distance * Math.cos(pitch);
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  const want = new THREE.Vector3(p.x - fx * horiz, p.y + 1.25 + CONFIG.cam.distance * Math.sin(pitch), p.z - fz * horiz);
  camera.position.lerp(want, 1 - Math.exp(-CONFIG.cam.lerp * dt));
  /* 别让相机钻进地面 */
  camera.position.y = Math.max(camera.position.y, 0.9);
  /* 圆形场景（洞穴大厅）：岩壁是 BackSide，相机一旦退到壁外就只剩黑屏 */
  const st = world.state;
  if (st && st.camRadius) {
    const d = Math.hypot(camera.position.x, camera.position.z);
    if (d > st.camRadius) {
      camera.position.x *= st.camRadius / d;
      camera.position.z *= st.camRadius / d;
    }
  }
  /* 注视点往前探 camLead 米：角色被压到画面下半部，身前的小路和树才有纵深 */
  camera.lookAt(p.x + fx * CONFIG.camLead, p.y + 1.35, p.z + fz * CONFIG.camLead);
}

/* ============================================================================
   14. 幕间切换
   ========================================================================== */

const el = {
  card: document.getElementById('card'),
  chapter: document.getElementById('chapter'),
  trail: document.getElementById('trail'),
  hint: document.getElementById('hint'),
};

let hintTimer = 0, cardTimer = 0;

function showCard(c) {
  el.card.querySelector('.eyebrow').textContent = c.eyebrow;
  el.card.querySelector('h2').textContent = c.title;
  el.card.querySelector('.sub').textContent = c.sub;
  el.card.classList.add('on');
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => el.card.classList.remove('on'), 2600);
}

function toast(msg) {
  el.hint.textContent = msg;
  el.hint.classList.add('on');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.hint.classList.remove('on'), 3800);
}

function loadChapter(i) {
  world.chapter = i;
  const st = world.states[i] || (world.states[i] = CHAPTERS[i].build());
  world.state = st;
  st.scene.add(world.player);
  const sp = st.spawn;
  world.player.position.set(sp.x, 0, sp.z);
  /* 模型正面是局部 +Z，而 camYaw 的"前"是 -Z，所以这里差 π */
  world.player.rotation.set(0, sp.yaw + Math.PI, 0);
  world.vel.set(0, 0, 0);
  world.camYaw = sp.yaw;
  world.camPitch = CONFIG.cam.pitch;
  /* 相机直接落到起始位 */
  updateCamera(1);
  el.chapter.innerHTML = '<b>' + CHAPTERS[i].title + '</b>' + CHAPTERS[i].eyebrow;
  showCard(CHAPTERS[i]);
  toast(CHAPTERS[i].hint);
  world.enterAt = world.elapsed;
}

function advance() {
  if (world.finished) return;
  if (world.chapter < CHAPTERS.length - 1) loadChapter(world.chapter + 1);
  else finish();
}

/** 三幕走完：写回地图进度并返回 */
function finish() {
  world.finished = true;
  el.card.querySelector('.eyebrow').textContent = 'DOWN THE RABBIT HOLE';
  el.card.querySelector('h2').textContent = '掉进仙境';
  el.card.querySelector('.sub').textContent = '兔子洞已通关 · 毛毛虫的树枝解锁';
  el.card.classList.add('on');
  try { window.WonderlandProgress.completeScene('rabbit_hole'); } catch (err) { /* 独立打开时也允许通过 */ }
  setTimeout(() => { location.href = '../index.html'; }, 2600);
}

/* ============================================================================
   15. 主循环
   ========================================================================== */

const clock = new THREE.Clock();

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  world.elapsed += dt;

  if (world.state) {
    updatePlayer(dt);
    world.state.update(dt, world.elapsed);
    /* 切幕后 0.8 秒内不判定终点，避免幕间状态还没落稳就连跳几幕 */
    if (world.elapsed - world.enterAt > 0.8 && world.state.reachedEnd()) advance();
  }
  if (world.player) updateCamera(dt);

  el.trail.style.width = (world.state ? Math.round(world.state.progress() * 100) : 0) + '%';
  renderer.render(world.state.scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================================
   16. 启动：生成贴图 → 搭建第一幕
   ========================================================================== */

function init() {
  document.getElementById('grain').style.opacity = CONFIG.grain;
  /* 旧纸滤镜：整幅画面统一降饱和 + 上米黄，一步到位去掉"3D 卡通"数码感。
     想逐场景微调可以直接改 CONFIG.paperFilter；设 '' 就完全关闭。 */
  renderer.domElement.style.filter = CONFIG.paperFilter;

  /* 程序化手绘贴图（CONFIG.textures 里填了路径会自动改用外部素材） */
  const sizes = { grass: 512, dirt: 512, brick: 512, bark: 512, vine: 512, canopy: 512, rock: 512, caveWall: 512, caveFloor: 512, wood: 512, cap: 256, stem: 256, petal: 256, cloth: 256, door: 512, cake: 256 };
  for (const name in TEX_DRAW) {
    TEX[name] = makeTex(name, sizes[name] || 512, TEX_DRAW[name], [1, 1]);
  }

  /* 草叶 / 野花广告牌 */
  SPR.grassBill = billboardTex('grass');
  SPR.flowerBill = billboardTex('flower');

  /* 调试口子：?act=1|2|3 直接进第几幕，?cam=2.5 拉近相机看角色细节。
     正常游玩不带参数，行为和以前完全一样。 */
  const q = new URLSearchParams(location.search);
  if (q.has('cam')) CONFIG.cam.distance = Math.max(1.5, Math.min(14, parseFloat(q.get('cam')) || CONFIG.cam.distance));
  const act = parseInt(q.get('act'), 10);
  /* 调试：?bare=1 隐藏界面，?night=1 换成夜色灯光 —— 专门用来出首页主视觉 */
  if (q.has('bare')) {
    const back = document.getElementById('back'); if (back) back.style.display = 'none';
    const hud = document.getElementById('hud'); if (hud) hud.style.display = 'none';
  }

  world.player = makeAlice();
  loadChapter(act >= 1 && act <= 3 ? act - 1 : 0);

  if (q.has('night')) {
    const st = world.state;
    st.scene.fog.color.setHex(0x1b2437);
    st.scene.fog.density = 0.030;
    st.scene.background = verticalGradient('#0a1020', '#2a3550');
    st.scene.traverse((o) => {
      if (o.isAmbientLight) { o.color.setHex(0x8ea4cc); o.intensity = 0.72; }
      else if (o.isHemisphereLight) { o.color.setHex(0x30405f); o.groundColor.setHex(0x101722); o.intensity = 0.7; }
      else if (o.isDirectionalLight) { o.color.setHex(0xa8c0e8); o.intensity = 0.16; }
      else if (o.isSpotLight) { o.intensity = 0.22; }
    });
    /* 路心一点暖光，像洞里漏出来的灯 */
    const p0 = world.player.position;
    const glow = new THREE.PointLight(0xf0b46a, 1.5, 26, 2);
    glow.position.set(p0.x, 2.4, p0.z - 7);
    st.scene.add(glow);
  }
  frame();
}

init();
</script>
