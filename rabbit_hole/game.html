/* 三阶 Toon 明暗：暗部保留灰蓝底色，不压成纯黑；亮部到暖白 */
const TOON_RAMP = (() => {
  const data = new Uint8Array([
    168, 168, 168, 255,
    210, 210, 210, 255,
    255, 255, 255, 255,
  ]);
  const t = new THREE.DataTexture(data, 3, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();

/** 所有受光材质走 Toon 分层，保持原有的贴图/颜色/透明设置 */
function toonMat(params) {
  return new THREE.MeshToonMaterial(Object.assign({ gradientMap: TOON_RAMP }, params || {}));
}

const camera = new THREE.PerspectiveCamera(CONFIG.fov, innerWidth / innerHeight, 0.1, 400);

/* 每幕先建独立 Scene 作为搭建容器，搭好后整体搬进共用的 worldScene */
function newScene(bgTop, bgBottom, fogColor, fogDensity) {
  const s = new THREE.Scene();
  s.background = verticalGradient(bgTop, bgBottom);
  s.fog = new THREE.FogExp2(fogColor, fogDensity);
  return s;
}

/* 三幕共用一张 Scene：按行进方向首尾相接，镜头才能一路飞过去 */
const worldScene = new THREE.Scene();
const CHAPTER_LAYOUT = [
  { x: 0, y: 0, z: 0 },          // 幕 1 林间小路：z 10 → -126
  { x: 0, y: 0.012, z: -138 },   // 幕 2 兔子洞入口：接在林间尽头
  { x: 0, y: 0.024, z: -182.8 }, // 幕 3 洞穴大厅：接在洞口内侧
];

/** 天空/洞顶的柔和竖向渐变，手绘纸张感 */
function verticalGradient(top, bottom, size = 256) {
  const c = document.createElement('canvas');
  c.width = 8; c.height = size;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, size);
  grd.addColorStop(0, top);
  grd.addColorStop(0.55, mix(top, bottom, 0.6));
  grd.addColorStop(1, bottom);
  g.fillStyle = grd;
  g.fillRect(0, 0, 8, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function mix(a, b, k) {
  const pa = new THREE.Color(a), pb = new THREE.Color(b);
  return '#' + pa.lerp(pb, k).getHexString();
}

/* ============================================================================
   4. 走廊：路径中心线、可行走边界、进度
      一道路 = 一条 CatmullRom 曲线 + 每一点的半宽。
      碰撞 = 把角色拉回 |横向偏移| <= 半宽；障碍物再单独做圆形挤出。
   ========================================================================== */

function corridor(points, halfWidth, samples = 240) {
  const curve = new THREE.CatmullRomCurve3(
    points.map((p) => new THREE.Vector3(p[0], p[1] || 0, p[2])),
    false, 'catmullrom', 0.5
  );
  const table = [];
  let len = 0;
  let prev = null;
  for (let i = 0; i <= samples; i++) {
    const t = i / samples;
    const p = curve.getPointAt(t);
    const tan = curve.getTangentAt(t).normalize();
    if (prev) len += Math.hypot(p.x - prev.x, p.z - prev.z);
    table.push({
      x: p.x, z: p.z, y: p.y,
      tx: tan.x, tz: tan.z,
      sx: tan.z, sz: -tan.x,          // 水平侧向法线
      s: len,
    });
    prev = p;
  }
  return { curve, table, halfWidth, length: len, samples };
}

/** 找到走廊上离角色最近的采样点 */
function nearest(cor, x, z) {
  let best = cor.table[0], bd = Infinity;
  for (let i = 0; i < cor.table.length; i++) {
    const s = cor.table[i];
    const d = (s.x - x) * (s.x - x) + (s.z - z) * (s.z - z);
    if (d < bd) { bd = d; best = s; }
  }
  return { s: best, dist: Math.sqrt(bd), index: cor.table.indexOf(best) };
}

/** 走廊横向约束：把点推回可走范围内，返回是否贴到路边 */
function clampToCorridor(cor, pos, pad) {
  const near = nearest(cor, pos.x, pos.z);
  const limit = (typeof cor.halfWidth === 'function'
    ? cor.halfWidth(near.index / cor.samples) : cor.halfWidth) - (pad || 0.55);
  const lat = (pos.x - near.s.x) * near.s.sx + (pos.z - near.s.z) * near.s.sz;
  let blocked = false;
  if (Math.abs(lat) > limit) {
    const over = Math.abs(lat) - limit;
    pos.x -= near.s.sx * Math.sign(lat) * over;
    pos.z -= near.s.sz * Math.sign(lat) * over;
    blocked = true;
  }
  /* 起终点也做墙，避免走出幕外 */
  const along = (pos.x - near.s.x) * near.s.tx + (pos.z - near.s.z) * near.s.tz;
  if (near.index <= 1 && along < -1.2) { pos.z -= near.s.tz * (along + 1.2); pos.x -= near.s.tx * (along + 1.2); blocked = true; }
  if (near.index >= cor.samples - 1 && along > 0.6) { pos.z -= near.s.tz * (along - 0.6); pos.x -= near.s.tx * (along - 0.6); blocked = true; }
  return { blocked, progress: near.index / cor.samples, lateral: lat };
}

/** 圆形障碍（树干、岩石、桌子）挤出 */
function pushOut(obstacles, pos, radius) {
  for (const o of obstacles) {
    /* 玩法机关（门 / 闸门 / 移动石板）会临时把自己 disable 掉，
       矮小门只在非 Small 体型时生效 —— 全部走这一个开关。 */
    if (o.disabled) continue;
    const dx = pos.x - o.x, dz = pos.z - o.z;
    const d = Math.hypot(dx, dz);
    const min = o.r + radius;
    if (d < min && d > 0.0001) {
      const k = (min - d) / d;
      pos.x += dx * k;
      pos.z += dz * k;
    }
  }
}

/** 沿走廊布点：side=-1 左 / 1 右，offset 距中心线的横向距离 */
function alongCorridor(cor, count, side, offsetMin, offsetMax, i0 = 0.04, i1 = 0.96, jitterT = 0) {
  const out = [];
  for (let k = 0; k < count; k++) {
    let t = i0 + (i1 - i0) * (count === 1 ? 0.5 : k / (count - 1));
    /* 纵向抖动：打断等距"列队"感，树看起来是自然长出来的 */
    if (jitterT) t = Math.min(i1, Math.max(i0, t + rnd(-jitterT, jitterT)));
    const s = cor.table[Math.round(t * cor.samples)];
    const off = (typeof offsetMin === 'function' ? offsetMin(t) : offsetMin) +
      rnd(0, (typeof offsetMax === 'function' ? offsetMax(t) : offsetMax) - (typeof offsetMin === 'function' ? offsetMin(t) : offsetMin));
    out.push({
      x: s.x + s.sx * side * off,
      z: s.z + s.sz * side * off,
      t, s,
      rot: Math.atan2(s.tx, s.tz),
    });
  }
  return out;
}

/** 沿路径生成带状网格（土路 / 石砖路）。uvScale 控制贴图纵向密度。
 *  左右两侧各带一层低频起伏，路缘才不会是两条笔直平行线。 */
function ribbon(cor, hwFn, y, uvScale, texName, texRepeatAcross, tint) {
  const table = cor.table;
  const vCount = table.length;
  const across = 6;                       // 横向分段，让带子边缘有手绘的起伏
  const pos = new Float32Array(vCount * (across + 1) * 3);
  const uv = new Float32Array(vCount * (across + 1) * 2);
  const nor = new Float32Array(vCount * (across + 1) * 3);
  let v = 0;
  for (let i = 0; i < vCount; i++) {
    const s = table[i];
    const hw = hwFn(i / cor.samples);
    const eL = 1 + 0.26 * Math.sin(i * 0.057 + 1.3) + 0.15 * Math.sin(i * 0.19 + 0.4) + 0.07 * Math.sin(i * 0.41);
    const eR = 1 + 0.26 * Math.sin(i * 0.049 + 4.1) + 0.15 * Math.sin(i * 0.23 + 2.2) + 0.07 * Math.sin(i * 0.37 + 1.1);
    const left = -hw * eL, right = hw * eR;
    for (let j = 0; j <= across; j++) {
      const f = j / across;
      const lat = left + (right - left) * f;
      pos[v * 3] = s.x + s.sx * lat;
      pos[v * 3 + 1] = y + (Math.abs(lat) > hw * 0.94 ? -0.006 : 0);
      pos[v * 3 + 2] = s.z + s.sz * lat;
      nor[v * 3 + 1] = 1;
      uv[v * 2] = f * (texRepeatAcross || 1);
      uv[v * 2 + 1] = s.s / uvScale;
      v++;
    }
  }
  const idx = [];
  const row = across + 1;
  for (let i = 0; i < vCount - 1; i++) {
    for (let j = 0; j < row - 1; j++) {
      const a = i * row + j, b = a + row, c = a + 1, d = b + 1;
      idx.push(a, b, c, c, b, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const mesh = new THREE.Mesh(geo, mat(texName, texRepeatAcross || 1, 1, tint ? { color: tint } : {}));
  mesh.receiveShadow = true;
  return mesh;
}

/* ============================================================================
   5. 道具零件库 —— 全部只用平面 / 圆柱 / 盒子 / 球 / 锥
      顶点带随机抖动（wobble），避免出现"3D 味"的完美直线。
   ========================================================================== */

/** 给几何体做低频顶点抖动 */
function wobble(geo, amp, freq) {
  const p = geo.attributes.position;
  const f = freq || 1;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = Math.sin(x * f * 2.1 + y * f * 1.3) * Math.cos(z * f * 1.7 + y * f * 0.9);
    p.setXYZ(i, x + n * amp, y + Math.sin(z * f * 2.4 + x * f) * amp * 0.7, z + n * amp);
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/** 树干径向的细微凹凸：横向树皮环 + 纵向棱，保持轮廓不规则但不破形 */
function barkBands(geo, h, rBot) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const rr = Math.hypot(x, z);
    if (rr < 0.001) continue;
    const t = (y + h / 2) / h;
    const a = Math.atan2(z, x);
    const band = Math.sin(t * Math.PI * 7 + Math.sin(a * 3) * 0.6) * rBot * 0.028;
    const ridge = Math.sin(a * 5 + t * 4.5) * rBot * 0.018;
    const k = 1 + (band + ridge) / rr;
    p.setX(i, x * k);
    p.setZ(i, z * k);
  }
  geo.computeVertexNormals();
}

/** 老橡树：分层树干 + 板根 + 分叉枝 + 深浅不一的圆团树冠 */
function makeOak(scale, opts) {
  const o = opts || {};
  const far = !!o.far;
  const simple = !!o.simple;
  const noOut = !!o.noOutline;
  const g = new THREE.Group();
  const h = rnd(6.5, 9.5);
  const rBot = rnd(0.85, 1.25);
  const rTop = rBot * rnd(0.5, 0.62);
  const barkExtra = far ? { color: 0xc9bda3 } : {};

  const trunkGeo = wobble(new THREE.CylinderGeometry(rTop, rBot, h, 14, 10), 0.10, 0.9);
  barkBands(trunkGeo, h, rBot);
  const trunk = part(trunkGeo, mat('bark', 2, 3, barkExtra), [0, h / 2, 0]);
  trunk.castShadow = !simple;
  if (!noOut) withOutline(trunk, 0.02);
  g.add(trunk);

  /* 树皮分层：几圈略外鼓的短圆台。用和树干同一套横向重复的树皮贴图，
     纵向纹理方向一致，不会像圆环体那样把贴图拧到和树干错位 */
  if (!simple) {
    for (let i = 0; i < 3; i++) {
      const f = 0.22 + i * 0.24 + rnd(-0.02, 0.02);
      const rr = rBot + (rTop - rBot) * f;
      const bandH = h * rnd(0.05, 0.08);
      const ring = new THREE.Mesh(
        new THREE.CylinderGeometry(rr * 1.02, rr * 1.05, bandH, 14, 1, true),
        mat('bark', 2, 0.55, barkExtra));
      ring.position.y = h * f;
      ring.rotation.y = rnd(0, 6.28);
      ring.castShadow = true;
      g.add(ring);
    }
  }

  /* 扭曲的根：绕基部一圈斜插的粗锥（远景省掉） */
  const roots = simple ? 0 : 4 + ((Math.random() * 3) | 0);
  for (let i = 0; i < roots; i++) {
    const a = (i / roots) * Math.PI * 2 + rnd(-0.3, 0.3);
    const len = rnd(1.5, 2.6);
    const rg = new THREE.CylinderGeometry(0.06, rnd(0.3, 0.5), len, 7, 3);
    wobble(rg, 0.08, 1.4);
    const root = new THREE.Mesh(rg, mat('bark', 1, 1.4, barkExtra));
    root.position.set(Math.cos(a) * rBot * 0.9, len * 0.22, Math.sin(a) * rBot * 0.9);
    root.rotation.set(0, -a, Math.PI / 2 - rnd(0.95, 1.25));
    root.castShadow = true;
    g.add(root);
  }

  /* 主枝：向上外展的锥 */
  const branches = simple ? 2 : 3 + ((Math.random() * 3) | 0);
  for (let i = 0; i < branches; i++) {
    const a = (i / branches) * Math.PI * 2 + rnd(-0.5, 0.5);
    const len = rnd(2.4, 4.2);
    const bg = new THREE.CylinderGeometry(0.12, rTop * 0.8, len, 8, 3);
    wobble(bg, 0.1, 1.1);
    const b = new THREE.Mesh(bg, mat('bark', 1, 1.6, barkExtra));
    b.position.set(Math.cos(a) * rTop * 0.5, h * rnd(0.72, 0.92), Math.sin(a) * rTop * 0.5);
    b.rotation.set(Math.PI / 2 - rnd(0.7, 1.15), -a, 0);
    b.castShadow = !simple;
    g.add(b);
    /* 枝头挂一团冠 */
    g.add(canopyPuff(Math.cos(a) * (rTop + len * 0.62), h * rnd(0.86, 1.06) + len * 0.3, Math.sin(a) * (rTop + len * 0.62), rnd(1.7, 2.7), far ? 1 : -1, noOut));
  }

  /* 树冠主体：深浅不一的圆团层叠，避免一整颗大球 */
  const cy = h * rnd(0.98, 1.12);
  const puffs = simple ? 4 : 7 + ((Math.random() * 3) | 0);
  for (let i = 0; i < puffs; i++) {
    g.add(canopyPuff(rnd(-2.7, 2.7), cy + rnd(-1.8, 1.8), rnd(-2.7, 2.7), rnd(1.6, 3.0), far ? 1 : -1, noOut));
  }
  if (!simple) g.add(canopyPuff(0, cy + 0.35, 0, rnd(2.1, 2.9), far ? 1 : -1, noOut));

  /* 垂藤：只挂两三缕，太多会变成"珠帘"且吃性能 */
  if (o.vines !== false) {
    for (let i = 0; i < 2 + ((Math.random() * 2) | 0); i++) {
      const a = rnd(0, Math.PI * 2), rr = rnd(1.4, 2.8);
      g.add(vineStrand(Math.cos(a) * rr, cy + rnd(-0.4, 1.2), Math.sin(a) * rr, rnd(1.6, 4.2)));
    }
  }

  g.scale.setScalar(scale || 1);
  g.userData.trunkRadius = rBot * (scale || 1);
  return g;
}

/** 一团树冠：深浅不一的压扁球 + 描边 */
let CANOPY_MATS = null;
function canopyPuff(x, y, z, r, tone, noOutline) {
  if (!CANOPY_MATS) {
    /* 深浅靠三张同风格贴图区分，而不是把同一张绿图乘上深色
       —— 乘算只会发闷发脏，远景和背光团容易糊成黑斑 */
    CANOPY_MATS = [
      mat('vine', 2, 2),                              // 0 中间调
      mat('canopyLight', 2, 2),                       // 1 受光浅色
      mat('canopyDeep', 2, 2),                        // 2 背光深色
      mat('canopyLight', 2, 2, { color: 0xf2f4e2 }),  // 3 远景最淡
      mat('canopyLight', 2, 2, { color: 0xdfe6cc }),  // 4 中间偏浅
    ];
  }
  const material = tone === 1
    ? CANOPY_MATS[[1, 3, 1][(Math.random() * 3) | 0]]
    : tone === -1 ? CANOPY_MATS[[0, 1, 2, 4][(Math.random() * 4) | 0]] : CANOPY_MATS[0];
  const m = new THREE.Mesh(GEO.lowSphere, material);
  m.position.set(x, y, z);
  m.scale.set(r * rnd(0.9, 1.1), r * rnd(0.58, 0.82), r * rnd(0.85, 1.15));
  m.rotation.y = rnd(0, 6);
  /* 远景冠团不投影：雾里看不出，还能省掉一大半阴影 pass */
  m.castShadow = tone !== 1;
  if (!noOutline) withOutline(m, 0.035);
  return m;
}

/** 藤蔓：微微弯曲的细茎 + 沿途几片扁叶（用叶片贴图，不是小球） */
function vineStrand(x, y, z, len) {
  const g = new THREE.Group();
  const seg = 4;
  const bend = rnd(-0.5, 0.5);
  for (let i = 0; i < seg; i++) {
    const s = len / seg;
    const f = i / seg;
    const c = part(GEO.cyl, mat('bark', 1, 1, { color: 0x8f9a6a }),
      [bend * f * f * len * 0.5, -s * (i + 0.5), f * f * 0.2], [0.035 + f * 0.02, s * 1.04, 0.035 + f * 0.02],
      [0, 0, bend * 0.12]);
    g.add(c);
  }
  const leafMat = toonMat({ color: 0x7c8b60, side: THREE.DoubleSide });
  for (let i = 0; i < 5; i++) {
    const f = rnd(0.15, 1);
    const leaf = new THREE.Mesh(GEO.leaf, leafMat);
    const s = rnd(0.2, 0.36);
    leaf.scale.set(s, s, 1);
    leaf.position.set(bend * f * f * len * 0.5 + rnd(-0.12, 0.12), -len * f, rnd(-0.12, 0.12));
    leaf.rotation.set(rnd(-0.7, 0.7), rnd(-0.9, 0.9), rnd(-1.2, 1.2));
    g.add(leaf);
  }
  g.position.set(x, y, z);
  g.userData.sway = rnd(0, 6);
  return g;
}

/** 蘑菇：菌盖（半球）+ 菌柄 + 菌褶圆盘 */
function makeMushroom(capR, opts) {
  const o = opts || {};
  const g = new THREE.Group();
  const big = capR >= 0.55;
  const small = capR <= 0.32;
  const stemH = (o.stemH || capR * rnd(1.1, 1.6));
  const stem = part(new THREE.CylinderGeometry(
    capR * (big ? 0.32 : 0.30),
    capR * (big ? 0.46 : small ? 0.38 : 0.42),
    stemH, 10, 3),
  mat('stemGrad', 1, 1), [0, stemH / 2, 0]);
  stem.castShadow = true;
  withOutline(stem, 0.05);
  g.add(stem);

  const capGeo = new THREE.SphereGeometry(capR, 16, 9, 0, Math.PI * 2, 0, Math.PI * 0.52);
  wobble(capGeo, capR * 0.045, 1.6);
  const cap = new THREE.Mesh(capGeo, mat('cap', 1, 1));
  cap.position.y = stemH - capR * 0.06;
  cap.scale.y = big ? rnd(0.80, 0.98) : small ? rnd(0.92, 1.12) : rnd(0.66, 0.92);
  cap.castShadow = true;
  withOutline(cap, 0.045);
  g.add(cap);

  const gills = part(GEO.disc, flatMat(0xd8c9a1), [0, stemH - capR * 0.08, 0], [capR * 0.97, capR * 0.97, 1], [Math.PI / 2, 0, 0]);
  g.add(gills);

  if (o.spots !== false) {
    const dotN = big ? 8 : small ? 3 : 5;
    for (let i = 0; i < dotN; i++) {
      const a = rnd(0, 6.28), rr = capR * rnd(0.18, 0.74);
      const sr = capR * (big ? rnd(0.10, 0.24) : rnd(0.06, 0.19));
      const dot = part(GEO.disc, flatMat(PAL.cream), [Math.cos(a) * rr, stemH + Math.cos(rr / capR) * capR * 0.42, Math.sin(a) * rr],
        [sr, sr, 1], [-0.9 + rnd(-0.3, 0.3), a, 0]);
      g.add(dot);
    }
  }
  g.userData.capR = capR;
  return g;
}

/** 石块：压扁抖动的球 */
function makeRock(r, color) {
  const geo = new THREE.SphereGeometry(r, 10, 7);
  wobble(geo, r * 0.22, 1.2);
  /* 轻微提亮底色：不然在绿色天光下会被染成一块"草地"，认不出是石头 */
  const m = new THREE.Mesh(geo, mat('rock', 1, 1, { color: 0xdad4c4 }));
  m.scale.set(rnd(1, 1.35), rnd(0.66, 0.98), rnd(0.9, 1.25));
  m.rotation.set(rnd(-0.2, 0.2), rnd(0, 6), rnd(-0.15, 0.15));
  withOutline(m, 0.03);
  return m;
}

/** 横卧的树根：躺平沿 X 轴并稍微翘起一头，像从土里拱出来的气根；
 *  用外层 Group 控制朝向，避免欧拉角把倾斜轴一起转走。 */
function makeRoot(len, r) {
  const g = new THREE.Group();
  const geo = new THREE.CylinderGeometry(r * 0.45, r * 1.15, len, 9, 4);
  wobble(geo, r * 0.3, 1.1);
  const m = new THREE.Mesh(geo, mat('bark', 2, 1));
  const tilt = rnd(0.14, 0.26) * (Math.random() < 0.5 ? -1 : 1);
  m.rotation.z = Math.PI / 2 + tilt;
  /* 让低的那一头扎进土里，高的那头只离地一点点，就不会像根悬空的木棍 */
  m.position.y = Math.abs(Math.sin(tilt)) * len * 0.5 * 0.35 + r * 0.1;
  withOutline(m, 0.022);
  g.add(m);
  /* 根脚一撮苔：遮住"圆柱插进平面"的接缝 */
  const moss = part(GEO.lowSphere, flatMat(0x77875a), [Math.cos(tilt > 0 ? Math.PI : 0) * len * 0.42, r * 0.1, 0],
    [r * 2.6, r * 0.9, r * 2.2]);
  g.add(moss);
  return g;
}

/** 草丛 / 野花：透明广告牌精灵，最省钱也最有插画味 */
function makeBillboards(texName, count, areaFn, tint, sMin, sMax) {
  const grp = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const p = areaFn(i, count);
    const m = new THREE.Sprite(new THREE.SpriteMaterial({
      map: SPR[texName], transparent: true, depthWrite: false,
      color: tint || 0xffffff, alphaTest: 0.18,
    }));
    const s = rnd(sMin === undefined ? 0.42 : sMin, sMax === undefined ? 0.86 : sMax);
    m.scale.set(s, s, 1);
    m.position.set(p.x, s * 0.42, p.z);
    m.userData.base = m.position.y;
    grp.add(m);
  }
  return grp;
}

/** 成簇的草/花：围着中心错落生成，合成一个 InstancedMesh（1 个 draw call） */
function makeBillboardClusters(texName, clusters, perMin, perMax, areaFn, tint, sMin, sMax) {
  const pts = [];
  for (let c = 0; c < clusters; c++) {
    const p = areaFn(c, clusters);
    const n = perMin + ((Math.random() * (perMax - perMin + 1)) | 0);
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.28), rr = Math.sqrt(Math.random()) * rnd(0.25, 0.95);
      pts.push({ x: p.x + Math.cos(a) * rr, z: p.z + Math.sin(a) * rr, s: rnd(sMin, sMax) });
    }
  }
  const mesh = new THREE.InstancedMesh(crossQuadGeo(), toonMat({
    map: SPR[texName], transparent: true, alphaTest: 0.24,
    side: THREE.DoubleSide, depthWrite: false, color: tint || 0xffffff,
  }), pts.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
  const up = new THREE.Vector3(0, 1, 0);
  const p3 = new THREE.Vector3(), s3 = new THREE.Vector3();
  pts.forEach((p, i) => {
    p3.set(p.x, p.s * 0.42, p.z);
    q.setFromAxisAngle(up, rnd(0, 6.28));
    s3.set(p.s, p.s, p.s);
    m4.compose(p3, q, s3);
    mesh.setMatrixAt(i, m4);
  });
  mesh.instanceMatrix.needsUpdate = true;
  mesh.frustumCulled = false;
  return mesh;
}

/** 十字交叉的双面片：草 / 花共用，一个 InstancedMesh 就能画完一整片 */
let _crossGeo = null;
function crossQuadGeo() {
  if (_crossGeo) return _crossGeo;
  const a = new THREE.PlaneGeometry(1, 1);
  const b = new THREE.PlaneGeometry(1, 1);
  b.rotateY(Math.PI / 2);
  const pa = a.attributes.position.array, pb = b.attributes.position.array;
  const pos = new Float32Array(pa.length + pb.length);
  pos.set(pa);
  pos.set(pb, pa.length);
  const ua = a.attributes.uv.array, ub = b.attributes.uv.array;
  const uv = new Float32Array(ua.length + ub.length);
  uv.set(ua);
  uv.set(ub, ua.length);
  const ia = a.index.array, ib = b.index.array;
  const idx = new Uint16Array(ia.length + ib.length);
  idx.set(ia);
  const vOff = a.attributes.position.count;
  for (let i = 0; i < ib.length; i++) idx[ia.length + i] = ib[i] + vOff;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  _crossGeo = geo;
  return geo;
}

/** 交叉双面片草丛：整片地面只占 1 个 draw call，用来把草地铺厚 */
function makeGrassTufts(count, areaFn, tint, sMin, sMax) {
  const mesh = new THREE.InstancedMesh(crossQuadGeo(), toonMat({
    map: SPR.grassBill, transparent: true, alphaTest: 0.3,
    side: THREE.DoubleSide, depthWrite: false, color: tint,
  }), count);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
  const up = new THREE.Vector3(0, 1, 0);
  const p3 = new THREE.Vector3(), s3 = new THREE.Vector3();
  const tint3 = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const p = areaFn(i, count);
    const s = rnd(sMin, sMax) * (p.k || 1);
    p3.set(p.x, s * 0.44, p.z);
    q.setFromAxisAngle(up, rnd(0, 6.28));
    s3.set(s * rnd(0.8, 1.25), s, s * rnd(0.8, 1.25));
    m4.compose(p3, q, s3);
    mesh.setMatrixAt(i, m4);
    /* 每丛草深浅略不同，整片才不会像复制粘贴 */
    const k = rnd(0.84, 1.06);
    tint3.setRGB(k, k * rnd(0.97, 1.04), k * rnd(0.88, 1.0));
    mesh.setColorAt(i, tint3);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.frustumCulled = false;
  return mesh;
}

/** 散落的小石块：实例化 + 背面描边，不参与碰撞 */
function makeStoneLitter(count, areaFn) {
  const geo = new THREE.SphereGeometry(1, 9, 6);
  wobble(geo, 0.22, 1.2);
  const body = new THREE.InstancedMesh(geo, mat('rock', 1, 1, { color: 0xd6d0c0 }), count);
  const hull = new THREE.InstancedMesh(geo, flatMat(CONFIG.outline.color, { side: THREE.BackSide }), count);
  const colors = [0xd8d2c2, 0xc9c2af, 0xbfb8a4, 0xd2c9b6];
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const p3 = new THREE.Vector3(), s3 = new THREE.Vector3();
  for (let i = 0; i < count; i++) {
    const p = areaFn(i, count);
    const sx = rnd(0.08, 0.26);
    const sy = sx * rnd(0.62, 0.95);
    const sz = sx * rnd(0.82, 1.25);
    p3.set(p.x, sy * 0.42, p.z);
    e.set(rnd(-0.16, 0.16), rnd(0, 6.28), rnd(-0.16, 0.16));
    q.setFromEuler(e);
    s3.set(sx, sy, sz);
    m4.compose(p3, q, s3);
    body.setMatrixAt(i, m4);
    s3.multiplyScalar(1.06);
    m4.compose(p3, q, s3);
    hull.setMatrixAt(i, m4);
    body.setColorAt(i, new THREE.Color(colors[i % colors.length]));
  }
  body.instanceMatrix.needsUpdate = true;
  hull.instanceMatrix.needsUpdate = true;
  if (body.instanceColor) body.instanceColor.needsUpdate = true;
  body.castShadow = true;
  body.receiveShadow = true;
  const grp = new THREE.Group();
  grp.add(body, hull);
  return grp;
}

/** 落叶：实例化平铺叶片，带轻微色差 */
function makeLeafLitter(count, areaFn) {
  const leafMat = toonMat({ color: 0xffffff, side: THREE.DoubleSide });
  const inst = new THREE.InstancedMesh(GEO.leaf, leafMat, count);
  const colors = [0xa9824e, 0x9c6a45, 0x8a7443, 0xb08a5a, 0x9f5f4a, 0x7f6a45];
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), qx = new THREE.Quaternion(), qy = new THREE.Quaternion();
  const p3 = new THREE.Vector3(), s3 = new THREE.Vector3();
  const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < count; i++) {
    const p = areaFn(i, count);
    const s = rnd(0.09, 0.18);
    p3.set(p.x, 0.036 + rnd(0, 0.006), p.z);
    qx.setFromAxisAngle(X, -Math.PI / 2 + rnd(-0.15, 0.15));
    qy.setFromAxisAngle(Y, rnd(0, 6.28));
    q.copy(qy).multiply(qx);
    s3.set(s, s, s);
    m4.compose(p3, q, s3);
    inst.setMatrixAt(i, m4);
    inst.setColorAt(i, new THREE.Color(colors[i % colors.length]));
  }
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  inst.receiveShadow = true;
  return inst;
}

/** 精灵图：手绘草叶与花（带透明通道，非平铺） */
function billboardTex(kind) {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  if (kind === 'grass') {
    for (let i = 0; i < 22; i++) {
      const x = rnd(16, size - 16), base = size - rnd(2, 8), h = rnd(26, 62), b = rnd(-0.6, 0.6);
      g.strokeStyle = pick([PAL.leafDark, PAL.leaf, PAL.moss, PAL.leafLight]);
      g.lineWidth = rnd(2, 4.4);
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(x, base);
      g.quadraticCurveTo(x + b * h * 0.35, base - h * 0.6, x + b * h * 0.9, base - h);
      g.stroke();
      g.strokeStyle = PAL.ink;
      g.globalAlpha = 0.22;
      g.lineWidth = 1;
      g.stroke();
      g.globalAlpha = 1;
    }
  } else {
    /* 一簇三朵小花：短茎、贴近地面，不要长成棒棒糖 */
    for (let f = 0; f < 3; f++) {
      const cx = rnd(34, size - 34), cy = rnd(40, size - 46), r = rnd(8, 13);
      const col = pick([PAL.rose, PAL.plum, PAL.sky, PAL.cream, '#e6a3b4']);
      g.strokeStyle = PAL.leafDark;
      g.lineWidth = 2.6;
      g.beginPath(); g.moveTo(cx, cy + r); g.quadraticCurveTo(cx + rnd(-5, 5), cy + r + 12, cx + rnd(-3, 3), size - 4); g.stroke();
      for (let p = 0; p < 5; p++) {
        const a = p / 5 * Math.PI * 2 + rnd(-0.1, 0.1);
        g.fillStyle = col;
        g.beginPath();
        g.ellipse(cx + Math.cos(a) * r * 0.6, cy + Math.sin(a) * r * 0.6, r * 0.42, r * 0.56, a, 0, 7);
        g.fill();
        g.strokeStyle = PAL.ink; g.globalAlpha = 0.3; g.lineWidth = 1.2; g.stroke(); g.globalAlpha = 1;
      }
      g.fillStyle = PAL.ochre;
      g.beginPath(); g.arc(cx, cy, r * 0.28, 0, 7); g.fill();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/** 薄雾片：几张大透明面片缓慢漂移 */
function makeMist(count, areaFn, color, opacity, sizeMin, sizeMax) {
  const grp = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const p = areaFn(i, count);
    const m = new THREE.Mesh(GEO.plane, new THREE.MeshBasicMaterial({
      map: SPR.mist, transparent: true, depthWrite: false, opacity: opacity,
      color: color, blending: THREE.NormalBlending,
    }));
    const s = rnd(sizeMin, sizeMax);
    m.scale.set(s, s * 0.55, 1);
    m.position.set(p.x, p.y === undefined ? rnd(0.8, 2.6) : p.y, p.z);
    m.userData.drift = rnd(-0.25, 0.25);
    m.userData.phase = rnd(0, 6);
    grp.add(m);
  }
  return grp;
}

/** 光点：萤火虫 / 尘埃 */
function makeMotes(count, areaFn, color, size, additive) {
  const grp = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const p = areaFn(i, count);
    const m = new THREE.Sprite(new THREE.SpriteMaterial({
      map: SPR.glow, color: color, transparent: true, depthWrite: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
      opacity: rnd(0.35, 0.9),
    }));
    const s = size * rnd(0.6, 1.5);
    m.scale.set(s, s, 1);
    m.position.set(p.x, p.y === undefined ? rnd(0.6, 3.4) : p.y, p.z);
    m.userData.home = m.position.clone();
    m.userData.phase = rnd(0, 6.28);
    m.userData.rate = rnd(0.25, 0.9);
    m.userData.amp = rnd(0.4, 1.6);
    grp.add(m);
  }
  return grp;
}

/** 丁达尔光束：几片倾斜的加色面片，插在树冠缝隙里 */
function makeShafts(count, areaFn, color, opacity) {
  const grp = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const p = areaFn(i, count);
    const m = new THREE.Mesh(GEO.plane, new THREE.MeshBasicMaterial({
      map: SPR.beam, transparent: true, depthWrite: false, opacity: opacity,
      color: color, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    }));
    const w = rnd(2.6, 6.2), h = rnd(10, 18);
    m.scale.set(w, h, 1);
    m.position.set(p.x, h * 0.5, p.z);
    /* 顺主光方向微微倾斜，才像从树冠斜洒下来，而不是竖着的门板 */
    m.rotation.set(rnd(-0.34, -0.18), rnd(0, 6.28), rnd(-0.18, 0.18));
    m.userData.base = opacity;
    m.userData.phase = rnd(0, 6);
    grp.add(m);
  }
  return grp;
}

/* ---- 路面斑驳树影：一张柔和的暗斑贴图乘在地面上，和真实阴影叠着用 ---- */
let DAPPLE_TEX = null;
function dappleTexture() {
  if (DAPPLE_TEX) return DAPPLE_TEX;
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, S, S);
  for (let i = 0; i < 160; i++) {
    const x = rnd(0, S), y = rnd(0, S), r = rnd(12, 66);
    const grd = g.createRadialGradient(x, y, r * 0.15, x, y, r);
    grd.addColorStop(0, 'rgba(62,72,48,' + rnd(0.05, 0.18).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(62,72,48,0)');
    g.fillStyle = grd;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  DAPPLE_TEX = new THREE.CanvasTexture(c);
  DAPPLE_TEX.wrapS = DAPPLE_TEX.wrapT = THREE.RepeatWrapping;
  DAPPLE_TEX.colorSpace = THREE.SRGBColorSpace;
  return DAPPLE_TEX;
}

/** 沿小路铺两块树影贴花（乘算），远近各一块，避免看出重复 */
function makeDapple(cor, opacity) {
  const grp = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const t = 0.12 + i * 0.33;
    const s = cor.table[Math.round(t * cor.samples)];
    const tex = dappleTexture().clone();
    tex.needsUpdate = true;
    tex.repeat.set(2.6, 2.2);
    tex.offset.set(rnd(0, 1), rnd(0, 1));
    const m = new THREE.Mesh(GEO.plane, new THREE.MeshBasicMaterial({
      map: tex, transparent: true, opacity: opacity,
      blending: THREE.MultiplyBlending, depthWrite: false, fog: false,
      polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
    }));
    m.scale.set(70, 62, 1);
    m.position.set(s.x, 0.045, s.z - 18);
    m.rotation.set(-Math.PI / 2, 0, rnd(0, 6.28));
    m.renderOrder = 1;
    grp.add(m);
  }
  return grp;
}

/* 草地色斑：大块软边深浅贴花，打散草皮贴图平铺出来的重复感 */
function makeGrassMottle(count, areaFn) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  for (let i = 0; i < 30; i++) {
    const x = rnd(0, 256), y = rnd(0, 256), r = rnd(26, 86);
    const dark = Math.random() < 0.55;
    const grd = ctx.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, dark ? 'rgba(96,112,74,0.5)' : 'rgba(206,216,172,0.45)');
    grd.addColorStop(1, dark ? 'rgba(96,112,74,0)' : 'rgba(206,216,172,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.28);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const grp = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const p = areaFn(i, count);
    const size = rnd(10, 24);
    const m = new THREE.Mesh(GEO.plane, new THREE.MeshBasicMaterial({
      map: tex, transparent: true, opacity: rnd(0.26, 0.48), depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3,
    }));
    m.scale.set(size, size * rnd(0.8, 1.2), 1);
    m.rotation.set(-Math.PI / 2, 0, rnd(0, 6.28));
    m.position.set(p.x, 0.012, p.z);
    grp.add(m);
  }
  return grp;
}

/** 白兔：几个椭球拼的引导摆件（角色保持极简，重点在场景） */
function makeRabbit() {
  const g = new THREE.Group();
  const fur = mat('cloth', 1, 1, { color: 0xf4efe2 });
  const body = part(GEO.sphere, fur, [0, 0.42, 0], [0.30, 0.34, 0.46]);
  const head = part(GEO.sphere, fur, [0, 0.68, 0.42], [0.21, 0.20, 0.22]);
  withOutline(body, 0.05); withOutline(head, 0.06);
  g.add(body, head);

  for (const s of [-1, 1]) {
    const ear = part(GEO.sphere, fur, [s * 0.09, 0.95, 0.38], [0.055, 0.20, 0.06], [0.3, 0, s * 0.22]);
    const inner = part(GEO.sphere, flatMat(0xd9a9a6), [s * 0.09, 0.95, 0.42], [0.03, 0.15, 0.03], [0.3, 0, s * 0.22]);
    g.add(ear, inner);
  }
  g.add(part(GEO.lowSphere, fur, [0, 0.45, -0.46], [0.12, 0.12, 0.12]));      // 尾
  for (const s of [-1, 1]) {
    g.add(part(GEO.sphere, flatMat(0x2b2720), [s * 0.08, 0.72, 0.58], [0.028, 0.028, 0.028]));   // 眼
    g.add(part(GEO.cyl, fur, [s * 0.1, 0.16, 0.2], [0.05, 0.3, 0.05], [0.2, 0, 0]));             // 前爪
  }
  /* 怀表：一点暖色高光，呼应插画里的金表 */
  const watch = part(GEO.disc, flatMat(0xd8b26a), [0.16, 0.42, 0.3], [0.06, 0.06, 1]);
  g.add(watch);
  g.userData.hop = 0;
  return g;
}

/* ============================================================================
   6. 拱门贴图适配 + 门零件
   ========================================================================== */

/** ExtrudeGeometry 的 UV 就是形状的原始坐标，这里按尺寸把贴图"缩放回 0-1" */
function fitTex(name, w, h, tiles) {
  const k = tiles || 1;
  return tiled(TEX[name], k / Math.max(w, 0.01), k / Math.max(h, 0.01));
}

/**
 * 一扇门：拱形木板 + 门内黑暗 + 可选暖光
 * 幕 2 的小树门、幕 3 的岩壁拱门都用它，只是尺寸不同。
 */
function makeDoor(w, h, opts) {
  const o = opts || {};
  const g = new THREE.Group();

  const panel = new THREE.Mesh(
    new THREE.ExtrudeGeometry(archShape(w, h), { depth: 0.1, bevelEnabled: false, curveSegments: 16 }),
    toonMat({ map: fitTex('door', w, h, o.tiles || 1) })
  );
  panel.position.z = -0.05;
  g.add(panel);

  /* 门洞里的黑 */
  const hole = new THREE.Mesh(
    new THREE.ExtrudeGeometry(archShape(w * 0.82, h * 0.9), { depth: 0.6, bevelEnabled: false, curveSegments: 14 }),
    flatMat(0x100e0b)
  );
  hole.position.z = -0.62;
  g.add(hole);

  /* 石框 */
  const frame = new THREE.Mesh(
    new THREE.ExtrudeGeometry(archShape(w * 1.34, h * 1.14), { depth: 0.16, bevelEnabled: false, curveSegments: 16 }),
    mat('rock', 1, 1)
  );
  frame.position.z = -0.16;
  g.add(frame);

  if (o.knob) {
    g.add(part(GEO.lowSphere, flatMat(0xd8b26a), [w * 0.32, h * 0.44, 0.09], [w * 0.055, w * 0.055, w * 0.055]));
  }
  if (o.step) {
    g.add(part(GEO.box, mat('rock', 1, 1), [0, -0.06, w * 0.62], [w * 1.5, 0.16, w * 0.7]));
  }

  /* 门缝透出的暖光 */
  if (o.glow) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: SPR.glow, color: 0xe8bd76, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, opacity: (o.glow || 0) * 0.5,
    }));
    s.scale.set(w * 2.0, h * 1.9, 1);
    s.position.set(0, h * 0.45, 0.2);
    g.add(s);
    g.userData.glow = s;
  }
  return g;
}

/** 拱形外圈取点：t∈[0,1) 沿"右侧上 → 顶部半圆 → 左侧下"走一圈，用于镶边乱石 */
function archRim(w, h, t) {
  const r = w / 2, sh = h - r;
  if (t < 0.25) return [r, (t / 0.25) * sh];
  if (t < 0.75) {
    const a = Math.PI * (1 - (t - 0.25) / 0.5);
    return [Math.cos(a) * r, sh + Math.sin(a) * r];
  }
  const f = (t - 0.75) / 0.25;
  return [-r, sh * (1 - f)];
}

/**
 * 兔子洞的洞口：一张拱形"黑洞"贴片 + 沿拱圈的压边乱石。
 * 不做实体隧道——土丘是实心球面，隧道会被自己的丘面挡住反而露馅；
 * 手绘插画里的洞本来就没有厚度，一张带 alpha 的拱形贴片最像。
 * 局部坐标：底边在 y=0、开口朝 +Z，整组由调用方贴着丘面倾斜摆放。
 */
function makeCaveMouth(w, h) {
  const g = new THREE.Group();

  const panel = new THREE.Mesh(
    new THREE.PlaneGeometry(w * 1.12, h * 1.12),
    new THREE.MeshBasicMaterial({ map: SPR.mouth, transparent: true, depthWrite: false })
  );
  panel.position.set(0, h * 0.5, 0);
  panel.renderOrder = 2;
  g.add(panel);
  g.userData.panel = panel;

  /* 拱圈乱石：压在贴片"后面"（局部 -Z），只从拱形轮廓外缘露出来当镶边，
     要是摆在前面就会飘在黑洞里，看着像一堆浮石。 */
  for (let i = 0; i < 34; i++) {
    const t = i / 34;
    const [x, y] = archRim(w, h, t);
    const push = rnd(0.3, 1.5);
    const nx = x === 0 ? 0 : Math.sign(x);
    const rr = makeRock(rnd(0.7, 1.8));
    rr.position.set(x + nx * push * 0.8, y + rnd(-0.5, 0.9) + push * 0.25, rnd(-3.6, -0.3));
    rr.rotation.set(rnd(-0.25, 0.25), rnd(0, 6.28), rnd(-0.2, 0.2));
    g.add(rr);
  }

  /* 拱脚两侧各压一块大石，洞口才像被土丘"含"住 */
  for (const s of [-1, 1]) {
    const b = makeRock(rnd(1.6, 2.2));
    b.position.set(s * (w * 0.5 + rnd(0.2, 0.8)), 0.5, rnd(-0.8, 0.6));
    b.rotation.y = rnd(0, 6.28);
    g.add(b);
  }
  g.userData.boulders = g.children.slice(-2);
  return g;
}

/* ============================================================================
   7. 幕 1 · 林间小路
      两侧粗大老橡树夹道，蜿蜒土路向纵深收束，白兔在前面引路。
   ========================================================================== */

function buildForest() {
  /* 雾调得更绿更薄：远处淡进林子里，近处路面仍看得清 */
  const HAZE = 0xc3cca4;
  const scene = newScene('#dce2c0', '#c3cca4', HAZE, 0.012);

  const amb = new THREE.AmbientLight(0xb0acd0, 0.36);
  const hemi = new THREE.HemisphereLight(0xd6d2ea, 0x5f5a70, 0.50);
  /* 主光压低一点：光更斜、树影更长，树干底部和树荫更暗 */
  const sun = new THREE.DirectionalLight(0xffdca8, 1.20);
  sun.position.set(-30, 30, -40);
  sun.target.position.set(0, 0, -58);
  sun.castShadow = true;
  sun.userData.shadowCaster = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -55;
  sun.shadow.camera.right = 55;
  sun.shadow.camera.top = 70;
  sun.shadow.camera.bottom = -70;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 160;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.02;
  scene.add(amb, hemi, sun, sun.target);

  /* 地面：柔和墨绿，不要高饱和的荧光草色 */
  const forestGround = part(GEO.plane, mat('grass', 34, 34, { color: 0xc7d2a9 }), [0, 0, -50], [300, 300, 1], [-Math.PI / 2, 0, 0]);
  forestGround.userData.ground = true;
  scene.add(forestGround);

  /* 蜿蜒中心线：x 左右摆动，z 一路向纵深 */
  const cor = corridor([
    [0, 0, 10], [2.4, 0, -2], [-2.6, 0, -16], [3.0, 0, -30],
    [-2.2, 0, -44], [3.2, 0, -58], [-1.4, 0, -72], [2.6, 0, -86],
    [-2.0, 0, -100], [1.2, 0, -114], [0, 0, -126],
  ], (t) => 3.5 + Math.sin(t * 6.2) * 0.45 - t * 0.5, 260);

  const hw = (t) => 3.5 + Math.sin(t * 6.2) * 0.45 - t * 0.5;

  /* 起点身后再接一段"路的尾巴"：弯进林子深处，回头也看不到路尽头。
     只做画面延伸，不参与进度判定，免得影响转场 */
  const hwB = (t) => 3.15 + t * 0.35;
  const corB = corridor([
    [3.4, 0, 86], [5.4, 0, 72], [0.6, 0, 58], [3.8, 0, 45],
    [0.2, 0, 32], [1.4, 0, 20], [0, 0, 10],
  ], hwB, 150);

  /* 三层带子：外圈偏草绿、中圈过渡、内圈才是路面。
     用颜色乘算把边缘"洗"进草地，比再加一层贴图更好控制接缝。 */
  scene.add(ribbon(cor, (t) => hw(t) * 3.4, 0.002, 9, 'dirt', 2.2, 0xc9d1aa));
  scene.add(ribbon(cor, (t) => hw(t) * 2.3, 0.006, 8, 'dirt', 1.7, 0xc0c9a0));
  scene.add(ribbon(cor, (t) => hw(t) * 1.6, 0.012, 7.5, 'dirt', 1.3, 0xd2c7a6));
  scene.add(ribbon(cor, (t) => hw(t), 0.022, 7, 'dirt', 1));

  /* 尾段用同一套四层带子，接缝处的宽度与主路对齐（z=10 处同为 3.5 m） */
  scene.add(ribbon(corB, (t) => hwB(t) * 3.4, 0.002, 9, 'dirt', 2.2, 0xc9d1aa));
  scene.add(ribbon(corB, (t) => hwB(t) * 2.3, 0.006, 8, 'dirt', 1.7, 0xc0c9a0));
  scene.add(ribbon(corB, (t) => hwB(t) * 1.6, 0.012, 7.5, 'dirt', 1.3, 0xd2c7a6));
  scene.add(ribbon(corB, (t) => hwB(t), 0.022, 7, 'dirt', 1));

  const obstacles = [];

  /* 尾段两侧的树：简单款大树贴路，中小树填后排 */
  for (const side of [-1, 1]) {
    const left = side < 0;
    for (const p of alongCorridor(corB, 6, side, (t) => hwB(t) + 1.8, (t) => hwB(t) + 4.4,
      left ? 0.05 : 0.02, left ? 0.96 : 0.94, 0.012)) {
      const tree = makeOak(rnd(1.2, 1.75), { vines: false, simple: true });
      tree.position.set(p.x, 0, p.z);
      tree.rotation.y = rnd(0, 6.28);
      scene.add(tree);
      obstacles.push({ x: p.x, z: p.z, r: tree.userData.trunkRadius + 0.8 });
      const tr = tree.userData.trunkRadius;
      scene.add(contactShadow(p.x, p.z, tr * 1.9, tr * 1.7, 1.0));
    }
    for (const p of alongCorridor(corB, 8, side, (t) => hwB(t) + 5.0, (t) => hwB(t) + 11,
      left ? 0.03 : 0.01, left ? 0.97 : 0.95, 0.014)) {
      const tree = makeOak(rnd(0.6, 0.95), { vines: false, far: true, simple: true });
      tree.position.set(p.x, 0, p.z);
      tree.rotation.y = rnd(0, 6.28);
      scene.add(tree);
      const tr = tree.userData.trunkRadius;
      scene.add(contactShadow(p.x, p.z, tr * 1.3, tr * 1.2, 0.3));
    }
  }

  /* 最远一层树用的半透明材质：同一份材质只克隆一次，避免材质数量爆炸 */
  const hazeCache = new Map();
  const hazeMat = (m) => {
    if (!hazeCache.has(m)) {
      const c = m.clone();
      c.transparent = true;
      c.opacity = 0.62;
      c.depthWrite = false;
      hazeCache.set(m, c);
    }
    return hazeCache.get(m);
  };

  /* 两侧老橡树：近景成排大树 + 远景更小更淡的一层，把小路夹成林间走廊。
     左右两侧数量与起始相位错开，避免长成两排对称的"树门" */
  for (const side of [-1, 1]) {
    const left = side < 0;
    /* 近景：贴路，树体更大，保留藤蔓与树脚小蘑菇 */
    for (const p of alongCorridor(cor, left ? 15 : 14, side,
      (t) => hw(t) + 1.9 + t * 0.7,
      (t) => hw(t) + 5.0,
      left ? 0.005 : 0.03, left ? 0.995 : 0.97, 0.012)) {
      const tree = makeOak(rnd(1.25, 2.0), { vines: true });
      tree.position.set(p.x, 0, p.z);
      tree.rotation.y = rnd(0, 6.28);
      scene.add(tree);
      obstacles.push({ x: p.x, z: p.z, r: tree.userData.trunkRadius + 0.8 });
      const tr = tree.userData.trunkRadius;
      scene.add(contactShadow(p.x, p.z, tr * 1.9, tr * 1.7, 1.0));

      /* 树脚苔藓与小蘑菇：每棵 2–3 个，点缀但不堆量 */
      for (let i = 0; i < 2 + (Math.random() < 0.5 ? 1 : 0); i++) {
        const m = makeMushroom(rnd(0.16, 0.34));
        const mx = p.x + rnd(-1.5, 1.5), mz = p.z + rnd(-1.5, 1.5);
        m.position.set(mx, 0, mz);
        scene.add(m);
        scene.add(contactShadow(mx, mz, 0.34, 0.3, 0.7));
      }
    }

    /* 远景：更小、色调更淡、部件精简，靠数量撑出林子纵深 */
    for (const p of alongCorridor(cor, left ? 22 : 20, side,
      (t) => hw(t) + 5.6,
      (t) => hw(t) + 15.0,
      left ? 0.006 : 0.024, left ? 0.996 : 0.978, 0.01)) {
      const tree = makeOak(rnd(0.5, 0.85), { vines: false, far: true, simple: true });
      tree.position.set(p.x, 0, p.z);
      tree.rotation.y = rnd(0, 6.28);
      scene.add(tree);
      const tr = tree.userData.trunkRadius;
      scene.add(contactShadow(p.x, p.z, tr * 1.3, tr * 1.2, 0.35));
    }

    /* 最远层：半透明、无描边，和雾一起糊成一片深绿，只负责把纵深推开 */
    for (const p of alongCorridor(cor, left ? 9 : 8, side,
      (t) => hw(t) + 16,
      (t) => hw(t) + 30,
      left ? 0.008 : 0.02, left ? 0.992 : 0.98, 0.013)) {
      const tree = makeOak(rnd(0.45, 0.72), { vines: false, far: true, simple: true, noOutline: true });
      tree.position.set(p.x, 0, p.z);
      tree.rotation.y = rnd(0, 6.28);
      tree.traverse((o) => {
        if (!o.isMesh) return;
        o.material = hazeMat(o.material);
        o.castShadow = false;
      });
      scene.add(tree);
    }
  }

  /* 林下层：树苗 + 贴地灌木，把大树干之间的空隙填满，走进去才有"林子里"的包围感 */
  for (const side of [-1, 1]) {
    for (const p of alongCorridor(cor, 11, side, (t) => hw(t) + 2.6, (t) => hw(t) + 8.5,
      side < 0 ? 0.012 : 0.045, side < 0 ? 0.988 : 0.955, 0.015)) {
      const s = makeOak(rnd(0.3, 0.55), { vines: false, simple: true });
      s.position.set(p.x, 0, p.z);
      s.rotation.y = rnd(0, 6.28);
      scene.add(s);
      const sr = s.userData.trunkRadius;
      scene.add(contactShadow(p.x, p.z, sr * 1.3, sr * 1.2, 0.4));
    }
    for (const p of alongCorridor(cor, 14, side, (t) => hw(t) + 2.0, (t) => hw(t) + 5.2,
      side < 0 ? 0.02 : 0.055, side < 0 ? 0.98 : 0.945, 0.02)) {
      const n = 2 + ((Math.random() * 2) | 0);
      for (let i = 0; i < n; i++) {
        const br = rnd(0.7, 1.3);
        const b = canopyPuff(p.x + rnd(-1.0, 1.0), br * rnd(0.45, 0.62), p.z + rnd(-1.0, 1.0), br, -1);
        b.castShadow = false;
        scene.add(b);
      }
    }
  }

  /* 头顶横斜的枝与冠团：两侧低垂相接成拱，只在中间留一条天光 */
  for (const side of [-1, 1]) {
    for (const p of alongCorridor(cor, 11, side, (t) => hw(t) * 0.5, (t) => hw(t) * 1.2, 0.03, 0.97, 0.01)) {
      scene.add(canopyPuff(p.x, rnd(11, 16.5), p.z, rnd(3.2, 5.6), -1));
    }
  }

  /* 半埋在路缘的气根：横跨路面方向躺，只压住路边而不是横在路中间 */
  for (const p of alongCorridor(cor, 8, 1, (t) => hw(t) * 0.98, (t) => hw(t) * 1.35, 0.08, 0.94)) {
    const len = rnd(1.6, 2.8), rad = rnd(0.14, 0.26);
    const r = makeRoot(len, rad);
    r.position.set(p.x, -0.03, p.z);
    r.rotation.y = Math.atan2(p.s.sz, p.s.sx);
    scene.add(r);
    scene.add(contactShadow(p.x, p.z, len * 0.52, rad * 1.9, 0.8, r.rotation.y, 0.03));
  }
  for (const p of alongCorridor(cor, 7, -1, (t) => hw(t) * 1.0, (t) => hw(t) * 1.4, 0.1, 0.9)) {
    const len = rnd(1.4, 2.6), rad = rnd(0.14, 0.24);
    const r = makeRoot(len, rad);
    r.position.set(p.x, -0.03, p.z);
    r.rotation.y = Math.atan2(p.s.sz, p.s.sx);
    scene.add(r);
    scene.add(contactShadow(p.x, p.z, len * 0.52, rad * 1.9, 0.8, r.rotation.y, 0.03));
  }

  /* 路边乱石 */
  for (const p of alongCorridor(cor, 10, -1, (t) => hw(t) + 0.4, (t) => hw(t) + 3.2, 0.05, 0.95)) {
    const rock = makeRock(rnd(0.35, 0.9));
    rock.position.set(p.x, 0.1, p.z);
    scene.add(rock);
    scene.add(contactShadow(p.x, p.z, 0.72, 0.6, 0.75));
    obstacles.push({ x: p.x, z: p.z, r: 0.5 });
  }

  /* 参考插画里的"主角蘑菇"：路缘每隔一段来一丛大菌盖 */
  for (const p of alongCorridor(cor, 11, 1, (t) => hw(t) * 1.15, (t) => hw(t) * 1.75, 0.05, 0.9)) {
    const cluster = new THREE.Group();
    const n = 2 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {
      const m = makeMushroom(rnd(0.34, 0.8));
      m.position.set(rnd(-0.5, 0.5), 0, rnd(-0.5, 0.5));
      m.rotation.y = rnd(0, 6.28);
      cluster.add(m);
    }
    cluster.position.set(p.x, 0, p.z);
    cluster.add(contactShadow(0, 0, 0.95, 0.85, 0.8));
    scene.add(cluster);
    obstacles.push({ x: p.x, z: p.z, r: 0.7 });
  }
  for (const p of alongCorridor(cor, 9, -1, (t) => hw(t) * 1.2, (t) => hw(t) * 1.8, 0.08, 0.92)) {
    const m = makeMushroom(rnd(0.3, 0.7));
    m.position.set(p.x, 0, p.z);
    m.rotation.y = rnd(0, 6.28);
    scene.add(m);
    scene.add(contactShadow(p.x, p.z, 0.8, 0.7, 0.8));
    obstacles.push({ x: p.x, z: p.z, r: 0.6 });
  }

  /* 起点身后的路尾同样撒蘑菇，比主路略稀 */
  for (const p of alongCorridor(corB, 6, 1, (t) => hwB(t) * 1.12, (t) => hwB(t) * 1.7, 0.05, 0.95)) {
    const cluster = new THREE.Group();
    const n = 2 + ((Math.random() * 2) | 0);
    for (let i = 0; i < n; i++) {
      const m = makeMushroom(rnd(0.28, 0.68));
      m.position.set(rnd(-0.45, 0.45), 0, rnd(-0.45, 0.45));
      m.rotation.y = rnd(0, 6.28);
      cluster.add(m);
    }
    cluster.position.set(p.x, 0, p.z);
    cluster.add(contactShadow(0, 0, 0.9, 0.8, 0.8));
    scene.add(cluster);
    obstacles.push({ x: p.x, z: p.z, r: 0.7 });
  }
  for (const p of alongCorridor(corB, 5, -1, (t) => hwB(t) * 1.15, (t) => hwB(t) * 1.75, 0.06, 0.94)) {
    const m = makeMushroom(rnd(0.24, 0.58));
    m.position.set(p.x, 0, p.z);
    m.rotation.y = rnd(0, 6.28);
    scene.add(m);
    scene.add(contactShadow(p.x, p.z, 0.7, 0.6, 0.8));
    obstacles.push({ x: p.x, z: p.z, r: 0.55 });
  }

  /* 花草：最密最高的一圈正好压在最外圈带子的边上，专门打断带状路面的硬边 */
  const edgeArea = (mul, from, to) => () => {
    const t = rnd(0.01, 0.99);
    const s = cor.table[Math.round(t * cor.samples)];
    const side = Math.random() < 0.5 ? -1 : 1;
    const off = hw(t) * mul + rnd(from, to);
    return { x: s.x + s.sx * side * off, z: s.z + s.sz * side * off };
  };
  /* 花草：成簇错落，靠近路缘放低矮草簇，边缘自然咬合 */
  scene.add(makeBillboardClusters('grassBill', 90, 3, 7, edgeArea(3.4, -1.4, 1.6), 0xd2dbba, 0.7, 1.35));
  scene.add(makeBillboardClusters('grassBill', 80, 3, 6, edgeArea(2.3, -0.9, 1.2), 0xd6dfbe, 0.5, 1.0));
  scene.add(makeBillboardClusters('grassBill', 60, 3, 6, edgeArea(3.8, 0, 9), 0xcbd5b0, 0.6, 1.3));
  scene.add(makeBillboardClusters('grassBill', 120, 2, 5, edgeArea(1.12, -0.05, 0.45), 0xcdd8ad, 0.24, 0.48));
  scene.add(makeBillboardClusters('flowerBill', 40, 2, 4, edgeArea(2.1, 0, 3.4), 0xf4efdc, 0.32, 0.6));
  scene.add(makeBillboardClusters('flowerBill', 18, 2, 3, edgeArea(1.1, 0, 0.5), 0xe9e0c8, 0.22, 0.4));

  /* 再加一层"实心"草丛：按簇长，有密有疏，路边密、往外稀，比均匀撒更自然 */
  const grassClumps = (clusters, offMin, offMax) => {
    const out = [];
    for (let i = 0; i < clusters; i++) {
      const tail = Math.random() < 0.22;
      const c = tail ? corB : cor;
      const t = rnd(0.005, 0.995);
      const s = c.table[Math.round(t * c.samples)];
      const side = Math.random() < 0.5 ? -1 : 1;
      const off = (tail ? hwB(t) : hw(t)) + offMin + Math.pow(Math.random(), 1.7) * (offMax - offMin);
      const cx = s.x + s.sx * side * off;
      const cz = s.z + s.sz * side * off;
      const n = 3 + Math.floor(Math.random() * 6);
      const spread = rnd(0.45, 1.5);
      const k = rnd(0.68, 1.3);                      // 整簇的大小：有的高、有的矮趴
      for (let j = 0; j < n; j++) {
        const a = rnd(0, 6.28), r2 = Math.sqrt(Math.random()) * spread;
        out.push({ x: cx + Math.cos(a) * r2, z: cz + Math.sin(a) * r2, k });
      }
    }
    return out;
  };
  const gNear = grassClumps(120, 0.05, 2.8);
  scene.add(makeGrassTufts(gNear.length, (i) => gNear[i], 0xcbd6a9, 0.3, 0.9));
  const gFar = grassClumps(66, 3.2, 15);
  scene.add(makeGrassTufts(gFar.length, (i) => gFar[i], 0xc3cea0, 0.42, 1.05));

  /* 地面深浅色斑：把整片草皮打散成一块块，不再是一张均匀的绿纸 */
  scene.add(makeGrassMottle(46, () => {
    const tail = Math.random() < 0.22;
    const c = tail ? corB : cor;
    const t = rnd(0, 1);
    const s = c.table[Math.round(t * c.samples)];
    const side = Math.random() < 0.5 ? -1 : 1;
    const off = rnd(4, 30);
    return { x: s.x + s.sx * side * off, z: s.z + s.sz * side * off };
  }));

  /* 小石块与落叶：贴地散落，不参与碰撞 */
  scene.add(makeStoneLitter(34, edgeArea(1.5, 0, 3.0)));
  scene.add(makeLeafLitter(150, edgeArea(2.0, -0.4, 4.5)));
  scene.add(makeLeafLitter(60, edgeArea(0.95, -0.5, 0.55)));

  /* 整片绿地都长满树：小路两侧 24 m 之外的草地全部铺林，
     用两个 InstancedMesh 一次画完，几百棵树也只有 2 个 draw call */
  {
    const spots = [];
    for (let gx = -132; gx <= 132; gx += 6.8) {
      for (let gz = 94; gz >= -180; gz -= 6.8) {
        const px = gx + rnd(-2.4, 2.4), pz = gz + rnd(-2.4, 2.4);
        if (Math.hypot(px, pz + 50) > 150) continue;
        let best = 1e9;
        for (let i = 0; i < cor.table.length; i++) {
          const s = cor.table[i];
          const dx = px - s.x, dz = pz - s.z;
          const d2 = dx * dx + dz * dz;
          if (d2 < best) best = d2;
        }
        if (best < 24 * 24) continue;             // 小路两侧留给近中景手工树
        let bestB = 1e9;
        for (let i = 0; i < corB.table.length; i++) {
          const s = corB.table[i];
          const dx = px - s.x, dz = pz - s.z;
          const d2 = dx * dx + dz * dz;
          if (d2 < bestB) bestB = d2;
        }
        if (bestB < 7 * 7) continue;              // 尾段路边也留出来
        spots.push({ x: px, z: pz, s: rnd(0.75, 1.45), r: rnd(0, 6.28) });
      }
    }
    const trunks = new THREE.InstancedMesh(
      new THREE.CylinderGeometry(0.26, 0.44, 6, 7, 1),
      mat('bark', 2, 3, { color: 0xb6ab92 }),
      spots.length);
    const crowns = new THREE.InstancedMesh(
      GEO.lowSphere,
      mat('canopyLight', 2, 2, { color: 0xc2cfa8 }),
      spots.length);
    const m4 = new THREE.Matrix4();
    const q4 = new THREE.Quaternion();
    const up = new THREE.Vector3(0, 1, 0);
    const pos = new THREE.Vector3();
    const scl = new THREE.Vector3();
    spots.forEach((p, i) => {
      q4.setFromAxisAngle(up, p.r);
      pos.set(p.x, 3 * p.s, p.z);
      scl.set(p.s, p.s, p.s);
      m4.compose(pos, q4, scl);
      trunks.setMatrixAt(i, m4);
      pos.set(p.x, 6.4 * p.s, p.z);
      scl.set(rnd(2.3, 2.9) * p.s, rnd(1.6, 2.0) * p.s, rnd(2.3, 2.9) * p.s);
      m4.compose(pos, q4, scl);
      crowns.setMatrixAt(i, m4);
    });
    trunks.instanceMatrix.needsUpdate = true;
    crowns.instanceMatrix.needsUpdate = true;
    trunks.castShadow = false;
    crowns.castShadow = false;
    trunks.frustumCulled = false;
    crowns.frustumCulled = false;
    scene.add(trunks, crowns);
  }

  /* 薄雾 + 光柱 + 萤火虫 */
  const mist = makeMist(26, (i, n) => {
    const t = i / n;
    const s = cor.table[Math.round(t * cor.samples)];
    return { x: s.x, y: rnd(1.0, 3.2), z: s.z };
  }, 0xe6e9c8, 0.19, 9, 22);
  scene.add(mist);

  /* 路面斑驳树影：一层柔和暗斑乘在地面上，和真实阴影一起做出"光从叶隙漏下来" */
  scene.add(makeDapple(cor, 0.55));

  /* 光柱放在两侧树缝里，不要堆在视线尽头 */
  const shafts = makeShafts(13, (i, n) => {
    const t = 0.04 + i / n * 0.88;
    const s = cor.table[Math.round(t * cor.samples)];
    const side = i % 2 ? 1 : -1;
    return { x: s.x + s.sx * side * hw(t) * 2.4, z: s.z + s.sz * side * hw(t) * 2.4 };
  }, 0xf7e9c0, 0.095);
  scene.add(shafts);

  const motes = makeMotes(34, () => {
    const t = rnd(0.02, 0.98);
    const s = cor.table[Math.round(t * cor.samples)];
    const side = Math.random() < 0.5 ? -1 : 1;
    const off = hw(t) * rnd(0.6, 2.2);
    return { x: s.x + s.sx * side * off, y: rnd(0.5, 3.4), z: s.z + s.sz * side * off };
  }, 0xffe6a8, 0.17, true);
  scene.add(motes);

  /* 白兔引导摆件 */
  const rabbit = makeRabbit();
  scene.add(rabbit);
  let rabbitT = 0.03; // 让白兔在起点附近更容易看见

  /* 走到路的尽头（幕 2 的洞口方向）触发转场 */
  const state = {
    scene, cor, corB, obstacles,
    spawn: { x: cor.table[3].x, z: cor.table[3].z, yaw: 0 },
    progress: () => world.player ? nearest(cor, world.player.position.x, world.player.position.z).index / cor.samples : 0,
    reachedEnd: () => state.progress() > 0.965,
    update(dt, t) {
      /* 兔子保持在玩家前方 6-10%，走到尽头就停下等 */
      const target = Math.min(0.93, Math.max(rabbitT + 0.055, state.progress() + 0.075));
      rabbitT += (target - rabbitT) * Math.min(1, dt * 1.6);
      const s = cor.table[Math.round(rabbitT * cor.samples)];
      const hop = Math.abs(Math.sin(t * 3.4)) * 0.34;
      rabbit.position.set(s.x + s.sx * 0.7, hop, s.z + s.sz * 0.7);
      rabbit.rotation.set(-hop * 0.5, Math.atan2(s.tx, s.tz), 0);

      mist.children.forEach((m) => {
        m.position.x += m.userData.drift * dt;
        m.material.opacity = 0.13 + Math.sin(t * 0.25 + m.userData.phase) * 0.06;
        m.quaternion.copy(camera.quaternion);
      });
      shafts.children.forEach((sh) => {
        sh.material.opacity = sh.userData.base * (0.7 + Math.sin(t * 0.5 + sh.userData.phase) * 0.3);
      });
      motes.children.forEach((mo) => {
        const u = mo.userData;
        mo.position.x = u.home.x + Math.sin(t * u.rate + u.phase) * u.amp;
        mo.position.y = u.home.y + Math.sin(t * u.rate * 0.7 + u.phase * 1.7) * u.amp * 0.4;
        mo.material.opacity = 0.35 + Math.abs(Math.sin(t * u.rate * 1.6 + u.phase)) * 0.55;
      });
    },
  };
  return state;
}

/* ============================================================================
   8. 幕 2 · 兔子洞入口
      石砖小路通向土丘上的巨大洞口，越靠近越暗，光向洞口汇聚。
   ========================================================================== */

function buildHole() {
  const HOLE_DARK = new THREE.Color(0x2c2a20);   // 贴近洞口时的雾色
  const scene = newScene('#9aa077', '#4f5238', 0x74775a, 0.012);

  const amb = new THREE.AmbientLight(0xaaa6c8, 0.40);
  const hemi = new THREE.HemisphereLight(0xd6d0e6, 0x5c5668, 0.48);
  const sun = new THREE.DirectionalLight(0xffd9a2, 1.05);
  sun.position.set(12, 28, 6);
  sun.target.position.set(0, 0, -10);
  sun.castShadow = true;
  sun.userData.shadowCaster = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -34;
  sun.shadow.camera.right = 34;
  sun.shadow.camera.top = 34;
  sun.shadow.camera.bottom = -34;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 100;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.02;
  scene.add(amb, hemi, sun, sun.target);

  /* 洞口深处的暖光，随玩家靠近而变亮：摆在拱门内侧，把乱石边缘烤暖 */
  const mouthLight = new THREE.PointLight(0xe9b46a, 0.45, 40, 2);
  mouthLight.position.set(0, 3.0, -21.0);
  scene.add(mouthLight);

  /* 土丘：一个巨大的扁球，前面露出弧面。wobble 拉出起伏，别是个标准篮球 */
  const M = { cx: 0, cy: -9, cz: -42, rx: 27, ry: 24, rz: 21 };
  const moundGeo = new THREE.SphereGeometry(1, 44, 28);
  wobble(moundGeo, 0.045, 1.7);
  const mound = new THREE.Mesh(moundGeo, mat('rock', 9, 6, { color: 0xbdb492 }));
  mound.scale.set(M.rx, M.ry, M.rz);
  mound.position.set(M.cx, M.cy, M.cz);
  mound.castShadow = true;
  mound.receiveShadow = true;
  scene.add(mound);

  /* 丘面的草皮斑块：ang≈0 才是朝着玩家这一面；避开拱口范围，否则苔块会糊在洞口上 */
  for (let i = 0; i < 40; i++) {
    const p = moundPoint(M, rnd(-1.05, 1.05), rnd(5, 14));
    if (Math.abs(p.x) < 8 && p.y < 13 && p.z > -28.5) continue;
    const patch = part(GEO.lowSphere, mat('grass', 2, 2, { color: 0x99a578 }), [p.x, p.y, p.z], [rnd(2.4, 5), rnd(0.6, 1.1), rnd(2.4, 5)]);
    patch.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p.n);
    scene.add(patch);
  }

  const holeGround = part(GEO.plane, mat('grass', 26, 26), [0, 0, -18], [220, 220, 1], [-Math.PI / 2, 0, 0]);
  holeGround.userData.ground = true;
  scene.add(holeGround);


  /* 石砖小路：从身后一路铺到拱脚前 */
  const cor = corridor([
    [0.6, 0, 12], [-1.6, 0, 2], [1.4, 0, -8], [-0.8, 0, -16], [0, 0, -20], [0, 0, -22],
  ], (t) => 2.9 + t * 0.9, 200);
  const hw = (t) => 2.9 + t * 0.9;
  /* uvScale = 每张贴图覆盖多少米。砖路要 1.5m/张、横向 4 张，铺出来才是脚下一块块的石板 */
  scene.add(ribbon(cor, (t) => hw(t) * 1.5, 0.006, 3.2, 'dirt', 2.2, 0xcfc7a4));
  scene.add(ribbon(cor, (t) => hw(t), 0.025, 1.5, 'brick', 4));

  const obstacles = [];

  /* 洞口前这一侧也补上树、草、蘑菇，让漫游沿途和第一幕的林子接得上。
     树只种到拱口前一段，别挡了洞口 */
  for (const side of [-1, 1]) {
    const left = side < 0;
    for (const p of alongCorridor(cor, left ? 7 : 6, side, (t) => hw(t) + 2.6, (t) => hw(t) + 9,
      left ? 0.04 : 0.07, left ? 0.72 : 0.66, 0.014)) {
      const tree = makeOak(rnd(1.0, 1.5), { vines: false, simple: true });
      tree.position.set(p.x, 0, p.z);
      tree.rotation.y = rnd(0, 6.28);
      scene.add(tree);
      obstacles.push({ x: p.x, z: p.z, r: tree.userData.trunkRadius + 0.8 });
      const tr = tree.userData.trunkRadius;
      scene.add(contactShadow(p.x, p.z, tr * 1.9, tr * 1.7, 0.9));
    }
    for (const p of alongCorridor(cor, left ? 9 : 8, side, (t) => hw(t) + 5, (t) => hw(t) + 14,
      left ? 0.02 : 0.05, left ? 0.78 : 0.72, 0.016)) {
      const tree = makeOak(rnd(0.6, 0.95), { vines: false, far: true, simple: true });
      tree.position.set(p.x, 0, p.z);
      tree.rotation.y = rnd(0, 6.28);
      scene.add(tree);
      scene.add(contactShadow(p.x, p.z, 0.6, 0.55, 0.3));
    }
  }

  /* 砖路两侧的草丛 */
  scene.add(makeGrassTufts(150, () => {
    const t = rnd(0.02, 0.95);
    const s = cor.table[Math.round(t * cor.samples)];
    const side = Math.random() < 0.5 ? -1 : 1;
    const off = hw(t) + 0.15 + Math.pow(Math.random(), 1.7) * 3.6;
    return { x: s.x + s.sx * side * off, z: s.z + s.sz * side * off };
  }, 0xcbd6a9, 0.3, 0.8));

  /* 砖路两侧的小蘑菇 */
  for (const p of alongCorridor(cor, 14, 1, (t) => hw(t) + 0.5, (t) => hw(t) + 3.4, 0.06, 0.9)) {
    const m = makeMushroom(rnd(0.16, 0.36));
    m.position.set(p.x, 0, p.z);
    m.rotation.y = rnd(0, 6.28);
    scene.add(m);
    scene.add(contactShadow(p.x, p.z, 0.5, 0.45, 0.7));
  }
  for (const p of alongCorridor(cor, 10, -1, (t) => hw(t) + 0.6, (t) => hw(t) + 3.8, 0.08, 0.88)) {
    const m = makeMushroom(rnd(0.14, 0.3));
    m.position.set(p.x, 0, p.z);
    m.rotation.y = rnd(0, 6.28);
    scene.add(m);
    scene.add(contactShadow(p.x, p.z, 0.45, 0.4, 0.7));
  }

  /* 洞口：贴着丘面后仰摆放，让拱面大致平行于球面，缝隙由拱圈乱石压住。
     尺寸留一点余地：拱口占太满的话，四周的岩壁和小树门就全被挤出画面。 */
  const MW = 8.6, MH = 8.2;
  const mouth = makeCaveMouth(MW, MH);
  mouth.position.set(0, 0.05, -21.8);
  mouth.rotation.x = -0.5;
  scene.add(mouth);
  obstacles.push({ x: -MW * 0.62, z: -21.6, r: 1.6 }, { x: MW * 0.62, z: -21.6, r: 1.6 });

  /* 丘脚的小树门：矮、圆、透暖光，分列拱口两侧。
     贴地摆放（底边落在 y=0），只取法线的水平分量定向，门才不会跟着球面往后仰。 */
  const doorSpots = [
    [0.25, 1.15], [-0.27, 1.05], [0.36, 1.3], [-0.38, 1.15], [0.47, 1.2], [-0.49, 1.0],
  ];
  const tinyDoors = [];
  for (const [ang, h] of doorSpots) {
    const p = moundPoint(M, ang, 0.05);
    const d = makeDoor(rnd(0.9, 1.25), h, { knob: true, step: true, glow: rnd(0.3, 0.55), tiles: 2 });
    d.position.set(p.x + p.n.x * 0.5, 0.0, p.z + p.n.z * 0.5);
    d.lookAt(d.position.x + p.n.x * 3, 0.0, d.position.z + p.n.z * 3);
    scene.add(d);
    tinyDoors.push(d);
    obstacles.push({ x: d.position.x, z: d.position.z, r: 0.9 });
  }

  /* 洞口周围的"小"蘑菇：以矮小为主，并且避开小树门的脚下，
     否则红色菌盖会把门挡住，读不出"旁边有几扇小小的树门"。 */
  for (let i = 0; i < 46; i++) {
    const spread = rnd(0, 1);
    const a = rnd(-1.15, 1.15);
    let mx = Math.sin(a) * (3 + spread * 13);
    const mz = -18.4 - Math.cos(a) * spread * 3.2 + rnd(0, 3.8);
    /* 挤到小路外侧，别长在砖面上 */
    mx = Math.sign(mx || 1) * Math.max(Math.abs(mx), hw(nearest(cor, mx, mz).index / cor.samples) + rnd(0.5, 2.5));
    if (tinyDoors.some((d) => Math.hypot(d.position.x - mx, d.position.z - mz) < 2.2)) continue;
    const capR = rnd(0.13, 0.42) * (Math.random() < 0.12 ? 1.6 : 1);
    const m = makeMushroom(capR);
    m.position.set(mx, 0, mz);
    m.rotation.y = rnd(0, 6.28);
    scene.add(m);
    scene.add(contactShadow(mx, mz, capR * 1.5, capR * 1.3, 0.7));
  }
  for (let i = 0; i < 30; i++) {
    /* 藤条从丘壁上方垂下，保持世界 -Y 方向才有"挂下来"的读感 */
    const p = moundPoint(M, rnd(-1.15, 1.15), rnd(6, 15));
    scene.add(vineStrand(p.x, p.y, p.z + 0.5, rnd(1.6, 5.2)));
  }
  for (let i = 0; i < 18; i++) {
    const a = rnd(-1.5, 1.5);
    let rx = Math.sin(a) * rnd(4, 16);
    const rz = -18.5 - Math.abs(Math.cos(a)) * rnd(0, 2.5) + rnd(-1, 5);
    rx = Math.sign(rx || 1) * Math.max(Math.abs(rx), hw(nearest(cor, rx, rz).index / cor.samples) + rnd(0.4, 2.2));
    if (tinyDoors.some((d) => Math.hypot(d.position.x - rx, d.position.z - rz) < 1.9)) continue;
    const rock = makeRock(rnd(0.4, 1.1));
    rock.position.set(rx, 0.15, rz);
    scene.add(rock);
    scene.add(contactShadow(rx, rz, 1.1, 0.95, 0.7));
    if (Math.hypot(rx, rz + 18) > 5) obstacles.push({ x: rx, z: rz, r: 0.7 });
  }

  const edgeArea = () => {
    const t = rnd(0.02, 0.98);
    const s = cor.table[Math.round(t * cor.samples)];
    const side = Math.random() < 0.5 ? -1 : 1;
    const off = hw(t) + rnd(0.2, 5);
    return { x: s.x + s.sx * side * off, z: s.z + s.sz * side * off };
  };
  scene.add(makeBillboards('grassBill', 300, edgeArea, 0xcdd4ac));
  scene.add(makeBillboards('flowerBill', 90, edgeArea, 0xe4dcc4));

  const mist = makeMist(18, (i, n) => {
    const t = i / n;
    const s = cor.table[Math.round(t * cor.samples)];
    return { x: s.x, y: rnd(0.8, 2.4), z: s.z };
  }, 0xb9b89a, 0.17, 8, 20);
  scene.add(mist);

  const motes = makeMotes(18, () => {
    const t = rnd(0.05, 0.95);
    const s = cor.table[Math.round(t * cor.samples)];
    const side = Math.random() < 0.5 ? -1 : 1;
    return { x: s.x + s.sx * side * hw(t) * rnd(0.2, 1.2), y: rnd(0.5, 3.6), z: s.z + s.sz * side * hw(t) * rnd(0.2, 1.2) };
  }, 0xffd98a, 0.22, true);
  scene.add(motes);

  const rabbit = makeRabbit();
  scene.add(rabbit);
  let rabbitT = 0.2;

  const state = {
    scene, cor, obstacles,
    spawn: { x: cor.table[2].x, z: cor.table[2].z, yaw: 0 },
    progress: () => nearest(cor, world.player.position.x, world.player.position.z).index / cor.samples,
    reachedEnd: () => world.player.position.z < -20.4 || state.progress() > 0.985,
    update(dt, t) {
      const pr = state.progress();

      /* 光线向洞口汇聚：越往里越暗、雾越浓，但暗下去的部分由洞口的暖光补回来，
         岩壁和砖路的线稿还得读得清，不能整段糊成黑块。 */
      const k = Math.min(1, Math.max(0, (pr - 0.25) / 0.7));
      amb.intensity = 0.40 - k * 0.14;
      hemi.intensity = 0.48 - k * 0.16;
      sun.intensity = 1.05 - k * 0.40;
      scene.fog.density = 0.012 + k * 0.010;
      mouthLight.intensity = 0.45 + k * 1.5 + Math.sin(t * 1.7) * 0.08;
      /* 雾色同步压暗，读起来就是"光被洞口吸走" */
      scene.fog.color.setHex(0x74775a).lerp(HOLE_DARK, k);
      /* 小树门透出的暖光：洞里越暗，这几点暖光越要跳出来，否则门会被丘壁吞掉 */
      tinyDoors.forEach((d, i) => {
        if (d.userData.glow) d.userData.glow.material.opacity = 0.22 + k * 0.10 + Math.sin(t * 1.1 + i) * 0.05;
      });

      /* 兔子一路跳进洞里 */
      const target = Math.min(0.99, Math.max(rabbitT + 0.03, pr + 0.16));
      rabbitT += (target - rabbitT) * Math.min(1, dt * 1.4);
      const s = cor.table[Math.round(rabbitT * cor.samples)];
      const hop = Math.abs(Math.sin(t * 3.6)) * 0.32;
      rabbit.position.set(s.x + s.sx * 0.5, hop, s.z + s.sz * 0.5);
      rabbit.rotation.set(-hop * 0.6, Math.atan2(s.tx, s.tz), 0);

      mist.children.forEach((m) => {
        m.position.z += m.userData.drift * dt * 0.6;
        m.material.opacity = 0.12 + Math.sin(t * 0.3 + m.userData.phase) * 0.05;
        m.quaternion.copy(camera.quaternion);
      });
      motes.children.forEach((mo) => {
        const u = mo.userData;
        mo.position.x = u.home.x + Math.sin(t * u.rate + u.phase) * u.amp;
        mo.position.y = u.home.y + Math.sin(t * u.rate * 0.6 + u.phase) * u.amp * 0.35;
        mo.material.opacity = 0.3 + Math.abs(Math.sin(t * u.rate * 1.4 + u.phase)) * 0.6;
      });
    },
  };
  return state;
}

/** 椭ipsoid 土丘表面取点 + 法线，用来贴小树门和藤蔓 */
function moundPoint(M, ang, y) {
  const s = (y - M.cy) / M.ry;
  const k = Math.sqrt(Math.max(0.0001, 1 - s * s));
  const x = M.cx + M.rx * k * Math.sin(ang);
  const z = M.cz + M.rz * k * Math.cos(ang);
  const n = new THREE.Vector3((x - M.cx) / M.rx, (y - M.cy) / M.ry, (z - M.cz) / M.rz).normalize();
  return { x, y, z, n };
}

/* ============================================================================
   9. 幕 3 · 洞穴内部大厅
      粗糙岩壁 + 大小不一的弧形木门 + 中央木桌（蛋糕与玻璃瓶）。
   ========================================================================== */

function buildHall() {
  const R = 23;                                   // 大厅半径
  const scene = newScene('#2b2721', '#171410', 0x211d18, 0.012);

  /* 环境光压低，靠一层冷紫补光托住暗部，再让桌面暖光成为视觉中心 */
  const amb = new THREE.AmbientLight(0x9d947f, 1.0);
  const hemi = new THREE.HemisphereLight(0x8f88a0, 0x1b1720, 0.62);
  const moon = new THREE.DirectionalLight(0xb8aed0, 1.25);
  moon.position.set(9, 22, 7);
  moon.target.position.set(0, 0, 0);
  moon.castShadow = true;
  moon.userData.shadowCaster = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -28;
  moon.shadow.camera.right = 28;
  moon.shadow.camera.top = 28;
  moon.shadow.camera.bottom = -28;
  moon.shadow.camera.near = 1;
  moon.shadow.camera.far = 70;
  moon.shadow.bias = -0.0005;
  moon.shadow.normalBias = 0.02;
  scene.add(amb, hemi, moon, moon.target);

  /* 桌上的暖光：衰减按平方走，3 米外就掉得很快，所以中心要够亮才压得住整厅，
     又不至于把岩壁一起洗白。 */
  const tableLight = new THREE.PointLight(0xf0c47c, 3.0, 26, 2);
  tableLight.position.set(0, 4.4, 0);
  scene.add(tableLight);

  const entryLight = new THREE.PointLight(0xc9a86a, 2.0, 20, 2);
  entryLight.position.set(0, 3.2, R - 2.5);
  scene.add(entryLight);

  /* 地面石板：半径比岩壁略大一点，避免抖动后的墙脚漏光 */
  const floor = part(GEO.disc, mat('caveFloor', 8, 8, { color: 0xb6ac93 }), [0, 0, 0], [R + 1.6, R + 1.6, 1], [-Math.PI / 2, 0, 0]);
  floor.userData.ground = true;
  scene.add(floor);

  /* 岩壁：内壁朝内的开口圆柱 */
  const wallGeo = new THREE.CylinderGeometry(R, R * 1.04, 15, 56, 3, true);
  wobble(wallGeo, 0.55, 0.35);
  const wall = new THREE.Mesh(wallGeo, toonMat({
    map: tiled(TEX.caveWall, 15, 2), color: 0xc4ba9f, side: THREE.BackSide,
  }));
  wall.position.y = 7.5;
  scene.add(wall);

  /* 穹顶 */
  const roofGeo = new THREE.SphereGeometry(R, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.52);
  wobble(roofGeo, 0.5, 0.3);
  const roof = new THREE.Mesh(roofGeo, toonMat({
    map: tiled(TEX.caveWall, 12, 5), color: 0xb8b09e, side: THREE.BackSide,
  }));
  roof.scale.y = 0.52;
  roof.position.y = 14.2;
  scene.add(roof);

  /* 钟乳石 */
  for (let i = 0; i < 26; i++) {
    const a = rnd(0, 6.28), r = rnd(3, R - 3);
    const h = rnd(1.2, 4.2);
    const stal = part(new THREE.ConeGeometry(rnd(0.2, 0.6), h, 8, 3), mat('caveWall', 1, 2),
      [Math.cos(a) * r, 12.4 - h * 0.4, Math.sin(a) * r], null, [Math.PI, 0, 0]);
    scene.add(stal);
    /* 地面石笋 */
    if (Math.random() < 0.5) {
      const h2 = rnd(0.8, 2.4);
      scene.add(part(new THREE.ConeGeometry(rnd(0.3, 0.8), h2, 8, 3), mat('caveWall', 1, 1),
        [Math.cos(a + 0.4) * r, h2 * 0.4, Math.sin(a + 0.4) * r]));
    }
  }

  const obstacles = [];

  /* 岩壁上大大小小的弧形木门 */
  const doors = [];
  const doorCount = 13;
  for (let i = 0; i < doorCount; i++) {
    /* 入口门（+Z）与尽头门（-Z）单独留位 */
    const a = (i / doorCount) * Math.PI * 2 + 0.24;
    if (Math.abs(Math.sin(a)) < 0.12) continue;
    const w = rnd(1.1, 3.6), h = w * rnd(1.3, 1.9);
    const lit = Math.random() < 0.35;
    const d = makeDoor(w, h, { glow: lit ? rnd(0.4, 0.75) : 0, knob: Math.random() < 0.6, tiles: 2 });
    d.position.set(Math.sin(a) * (R - 0.5), rnd(-0.1, 0.3), Math.cos(a) * (R - 0.5));
    d.rotation.y = a + Math.PI;
    scene.add(d);
    doors.push(d);
    if (lit) {
      const pl = new THREE.PointLight(0xe6b874, 0.85, 12, 2);
      pl.position.set(Math.sin(a) * (R - 2.4), h * 0.5, Math.cos(a) * (R - 2.4));
      scene.add(pl);
      d.userData.light = pl;
    }
    /* 门前的乱石与蘑菇 */
    if (Math.random() < 0.6) {
      const rock = makeRock(rnd(0.4, 0.9));
      rock.position.set(Math.sin(a) * (R - 2.6), 0.1, Math.cos(a) * (R - 2.6));
      scene.add(rock);
    }
  }

  /* 入口：幕 2 走进来的那扇大拱门 */
  const entry = makeDoor(6.4, 6.6, { glow: 0.5 });
  entry.position.set(0, 0, R - 0.4);
  entry.rotation.y = Math.PI;
  scene.add(entry);

  /* 尽头最大的那扇门 = 本章出口 */
  const exitDoor = makeDoor(4.6, 7.4, { glow: 0.85, knob: true, tiles: 1.5 });
  exitDoor.position.set(0, 0, -(R - 0.4));
  scene.add(exitDoor);
  const exitLight = new THREE.PointLight(0xf2c37f, 1.5, 18, 2);
  exitLight.position.set(0, 3.2, -(R - 3));
  scene.add(exitLight);

  /* ---- 中央木桌 + 蛋糕 + 玻璃瓶 ---- */
  const table = new THREE.Group();
  const TW = 3.6, TD = 2.0, TH = 1.05;
  const top = part(GEO.box, mat('wood', 2, 1), [0, TH, 0], [TW, 0.22, TD]);
  withOutline(top, 0.02);
  table.add(top);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = part(new THREE.CylinderGeometry(0.1, 0.14, TH, 8, 2), mat('wood', 1, 1),
      [sx * (TW / 2 - 0.3), TH / 2, sz * (TD / 2 - 0.28)]);
    withOutline(leg, 0.05);
    table.add(leg);
  }
  table.add(part(GEO.box, mat('wood', 2, 1), [0, TH * 0.42, 0], [TW * 0.82, 0.1, TD * 0.6]));

  /* 三层蛋糕 + 糖霜 + 樱桃 */
  const cake = new THREE.Group();
  const tiers = [[0.62, 0.30], [0.48, 0.26], [0.34, 0.22]];
  let cy = 0;
  tiers.forEach(([r, h], i) => {
    const t = part(new THREE.CylinderGeometry(r, r * 1.04, h, 18, 1), mat('cake', 2, 1), [0, cy + h / 2, 0]);
    withOutline(t, 0.03);
    cake.add(t);
    /* 糖霜：沿每层顶边围一圈奶白，再垂下几滴。
       糖霜必须跟着受光（Lambert），否则自发光的小白点会把蛋糕读成一窝蛋。 */
    cake.add(part(new THREE.CylinderGeometry(r * 1.03, r * 1.03, h * 0.42, 18, 1, true),
      toonMat({ color: 0xf3e7cb, side: THREE.DoubleSide }), [0, cy + h * 0.78, 0]));
    const icing = toonMat({ color: 0xf3e7cb });
    for (let k = 0; k < 5; k++) {
      const a = (k + i * 0.6) / 5 * Math.PI * 2;
      cake.add(part(GEO.lowSphere, icing, [Math.cos(a) * r * 1.04, cy + h * 0.66, Math.sin(a) * r * 1.04],
        [r * 0.15, r * 0.26, r * 0.15]));
    }
    cy += h;
  });
  for (let k = 0; k < 3; k++) {
    cake.add(part(GEO.lowSphere, flatMat(0xb8412f), [rnd(-0.12, 0.12), cy + 0.08, rnd(-0.12, 0.12)], [0.09, 0.09, 0.09]));
  }
  cake.position.set(-0.85, TH + 0.11, 0.05);
  table.add(cake);
  table.add(part(GEO.disc, mat('caveFloor', 1, 1), [-0.85, TH + 0.12, 0.05], [1.0, 1.0, 1], [-Math.PI / 2, 0, 0]));

  /* 玻璃瓶：细颈 + 软木塞 + 标签，微微自发光表示"药水" */
  const bottle = new THREE.Group();
  const glassMat = toonMat({
    color: 0xa8c8c0, transparent: true, opacity: 0.62,
    emissive: 0x2e4a44, emissiveIntensity: 0.28,
  });
  bottle.add(part(new THREE.CylinderGeometry(0.22, 0.24, 0.5, 14, 1), glassMat, [0, 0.25, 0]));
  bottle.add(part(new THREE.CylinderGeometry(0.09, 0.2, 0.16, 14, 1), glassMat, [0, 0.58, 0]));
  bottle.add(part(new THREE.CylinderGeometry(0.08, 0.08, 0.26, 12, 1), glassMat, [0, 0.79, 0]));
  bottle.add(part(new THREE.CylinderGeometry(0.09, 0.09, 0.1, 10, 1), mat('wood', 1, 1), [0, 0.96, 0]));
  bottle.add(part(GEO.plane, mat('cloth', 1, 1, { color: 0xe8dcc0, side: THREE.DoubleSide }), [0, 0.3, 0.245], [0.3, 0.22, 1]));
  const bottleGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: SPR.glow, color: 0x9fd6c0, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0.2,
  }));
  bottleGlow.scale.set(1.1, 1.3, 1);
  bottleGlow.position.y = 0.5;
  bottle.add(bottleGlow);
  bottle.position.set(0.95, TH + 0.11, -0.1);
  table.add(bottle);

  /* 桌上一把小刀和几只盘子，补足静物构图 */
  for (let i = 0; i < 2; i++) {
    table.add(part(GEO.disc, mat('caveFloor', 1, 1), [0.1 + i * 0.5, TH + 0.12, 0.62], [0.34, 0.34, 1], [-Math.PI / 2, 0, 0]));
  }
  table.position.set(0, 0, 0);
  scene.add(table);
  obstacles.push({ x: 0, z: 0, r: 2.5 });

  /* 角落散落的蘑菇 */
  for (let i = 0; i < 22; i++) {
    const a = rnd(0, 6.28);
    const r = rnd(R * 0.42, R - 1.6);
    const m = makeMushroom(rnd(0.25, 0.85));
    m.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    if (Math.hypot(m.position.x, m.position.z) > 3.4) scene.add(m);
    else i--;
  }
  /* 靠墙的碎石 */
  for (let i = 0; i < 18; i++) {
    const a = rnd(0, 6.28), r = rnd(R * 0.5, R - 1.2);
    const rock = makeRock(rnd(0.3, 0.8));
    rock.position.set(Math.cos(a) * r, 0.1, Math.sin(a) * r);
    scene.add(rock);
  }

  /* 洞内朦胧雾气（贴地）与浮尘 */
  const mist = makeMist(24, (i, n) => {
    const a = i / n * 6.28 + rnd(-0.2, 0.2), r = rnd(4, R - 2);
    return { x: Math.cos(a) * r, y: rnd(0.4, 2.6), z: Math.sin(a) * r };
  }, 0x8d8570, 0.13, 7, 16);
  scene.add(mist);

  const dust = makeMotes(70, () => {
    const a = rnd(0, 6.28), r = rnd(0, R - 3);
    return { x: Math.cos(a) * r, y: rnd(0.4, 8), z: Math.sin(a) * r };
  }, 0xd8c49a, 0.16, false);
  scene.add(dust);

  /* 头顶几处微光，替代"洞口汇聚"的光源。别太大太亮，否则变成一串悬空的灯泡 */
  const glows = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const a = rnd(0, 6.28), r = rnd(6, R - 4);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: SPR.glow, color: 0xe8c07a, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, opacity: 0.12,
    }));
    s.scale.set(rnd(1.1, 2.0), rnd(1.1, 2.0), 1);
    s.position.set(Math.cos(a) * r, rnd(6.5, 10), Math.sin(a) * r);
    s.userData.phase = rnd(0, 6);
    glows.add(s);
  }
  scene.add(glows);

  const state = {
    scene, obstacles,
    cor: null,
    /* 出生点往里收：镜头在身后 7.4m，贴着壁就会退到壁外变成黑屏 */
    spawn: { x: 0, z: R - 10, yaw: 0 },
    radius: R - 1.4,
    camRadius: R - 1.0,
    progress: () => {
      const p = world.player.position;
      return THREE.MathUtils.clamp(1 - (Math.hypot(p.x, p.z + (R - 3)) / (R - 4)), 0, 1);
    },
    reachedEnd: () => {
      const p = world.player.position;
      return p.z < -(R - 4) && Math.abs(p.x) < 4.2;
    },
    update(dt, t) {
      tableLight.intensity = 2.3 + Math.sin(t * 1.3) * 0.12;
      exitLight.intensity = 1.4 + Math.sin(t * 0.9) * 0.14;
      bottleGlow.material.opacity = 0.16 + Math.abs(Math.sin(t * 0.8)) * 0.10;
      doors.forEach((d, i) => {
        if (d.userData.light) d.userData.light.intensity = 0.34 + Math.sin(t * 1.1 + i) * 0.10;
        if (d.userData.glow) d.userData.glow.material.opacity = 0.18 + Math.sin(t * 1.1 + i) * 0.06;
      });
      glows.children.forEach((s) => {
        s.material.opacity = 0.12 + Math.abs(Math.sin(t * 0.5 + s.userData.phase)) * 0.10;
      });
      dust.children.forEach((mo) => {
        const u = mo.userData;
        mo.position.y = u.home.y + Math.sin(t * u.rate * 0.5 + u.phase) * 0.7;
        mo.position.x = u.home.x + Math.sin(t * u.rate * 0.3 + u.phase) * u.amp * 0.5;
        mo.material.opacity = 0.18 + Math.abs(Math.sin(t * u.rate + u.phase)) * 0.35;
      });
      mist.children.forEach((m) => {
        m.material.opacity = 0.10 + Math.sin(t * 0.22 + m.userData.phase) * 0.04;
        m.quaternion.copy(camera.quaternion);
      });
    },
  };
  return state;
}
